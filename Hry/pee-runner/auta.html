<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Auta 3D – policejní / civil</title>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: #0f1220; touch-action: none; user-select: none; -webkit-user-select: none; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 14px;
        padding: 40px 16px calc(18px + env(safe-area-inset-bottom, 0px));
        background: linear-gradient(to top, rgba(15,18,32,.92), rgba(15,18,32,0)); pointer-events: none; }
  #ui > * { pointer-events: auto; }
  .row { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; max-width: 420px; }
  .arrow { width: 56px; height: 56px; border-radius: 50%; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.08);
           color: #fff; font-size: 30px; line-height: 1; cursor: pointer; touch-action: manipulation; }
  .arrow:active { background: rgba(255,255,255,.22); }
  #name { flex: 1; text-align: center; color: #fff; font-size: 20px; font-weight: 600; letter-spacing: .3px; }
  #count { display: block; margin-top: 4px; font-size: 12px; font-weight: 400; color: rgba(255,255,255,.5); }
  .seg { display: flex; padding: 4px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); }
  .seg button { border: 0; background: transparent; color: rgba(255,255,255,.7); font-size: 16px; font-weight: 600; padding: 10px 22px;
                border-radius: 999px; cursor: pointer; touch-action: manipulation; display: flex; align-items: center; gap: 8px; }
  .seg button:disabled { opacity: .35; cursor: default; }
  .seg button.on { background: #1668c8; color: #fff; }
  .seg button#bCivil.on { background: #3a4058; }
  #colors { display: none; gap: 16px; }
  .sw { width: 38px; height: 38px; border-radius: 50%; border: 3px solid rgba(255,255,255,.25); cursor: pointer; padding: 0; touch-action: manipulation; }
  .sw.on { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.25); }
  #dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(255,255,255,.8); }
</style>
</head>
<body>
<div id="ui">
  <div class="row">
    <button class="arrow" id="prev" aria-label="Předchozí model">&#8249;</button>
    <div id="name"><span id="nm">Sedan</span><span id="count">1 / 4</span></div>
    <button class="arrow" id="next" aria-label="Další model">&#8250;</button>
  </div>
  <div id="colors"></div>
  <div class="seg">
    <button id="bPolice" class="on">Policejní</button>
    <button id="bCivil">Civil<span id="dot"></span></button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  let scene, camera, renderer, car;
  let isDragging = false;
  let previousMousePosition = { x: 0, y: 0 };
  let targetRotationY = 0, targetRotationX = 0;
  let rotationVelocityY = 0, rotationVelocityX = 0;
  const REG = {};

  // Náhodná barva civilních aut (při každém načtení jiná než minule)
  const PALETTE = [0xc0161b, 0xf2c200, 0x1c4fbd, 0x1f8a3b]; // červená, žlutá, modrá, zelená
  const BODY_COLOR = (() => {
    let last = -1, i;
    try { last = parseInt(localStorage.getItem('carColor'), 10); } catch (e) {}
    do { i = Math.floor(Math.random() * PALETTE.length); } while (i === last);
    try { localStorage.setItem('carColor', String(i)); } catch (e) {}
    return PALETTE[i];
  })();
  const BODY_MAT = new THREE.MeshStandardMaterial({ color: BODY_COLOR, roughness: .28, metalness: .35 });

  REG['sedan_police'] = (function () {
  // --- POLICEJNÍ COMBI ---
  const std = (c, r, m, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: r, metalness: m }, o));
  const M = {
    white: std(0xd8dde1, .28, .35),
    dark: std(0x14181d, .5, .15),
    black: std(0x08090a, .7, 0),
    glass: std(0x0d1822, .08, .35),
    chrome: std(0xc4cbcf, .18, .9),
    red: std(0xc0161b, .25, .15, { emissive: 0x400000 }),
    lamp: std(0xffffff, .08, .1, { emissive: 0x7fbfff, emissiveIntensity: .5 }),
    beaconL: std(0x1260ff, .15, .1, { emissive: 0x004cff, emissiveIntensity: 2 }),
    beaconR: std(0x1260ff, .15, .1, { emissive: 0x004cff, emissiveIntensity: 2 }),
    rim: std(0xc9ced2, .3, .7)
  };
  const BLUE = '#0a4bbd', YEL = '#ffd81a', INK = '#0a3f9e';
  const BL = '#1668c8', LM = '#d6f21c', AX = [-1.46, 1.226];

  function box(w, h, d, mat, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) {
    const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    o.position.set(x, y, z); o.rotation.set(rx, ry, rz); return o;
  }
  function tex(w, h, draw) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    draw(c.getContext('2d'));
    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }
  function decal(w, h, t, lit = true) {
    const Mat = lit ? THREE.MeshStandardMaterial : THREE.MeshBasicMaterial;
    return new THREE.Mesh(new THREE.PlaneGeometry(w, h),
      new Mat({ map: t, transparent: true, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }));
  }
  function spaced(x, str, cx, cy, sp) {
    const ws = [...str].map(ch => x.measureText(ch).width);
    let px = cx - (ws.reduce((a, b) => a + b, 0) + sp * (str.length - 1)) / 2;
    [...str].forEach((ch, i) => { x.fillText(ch, px, cy); px += ws[i] + sp; });
  }
  function bodyProfile() {
    const s = new THREE.Shape();
    s.moveTo(-2.28, .24);
    [[-2.33, .42], [-2.31, .70], [-2.20, .80], [-1.05, .93], [1.30, .99], [2.05, 1.01], [2.29, .98], [2.33, .62], [2.27, .26]]
      .forEach(p => s.lineTo(p[0], p[1]));
    return s;
  }
  function wheel(x, z) {
    const w = new THREE.Group(), s = Math.sign(z);
    const cyl = (r, h, m) => { const o = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 32), m); o.rotation.x = Math.PI / 2; return o; };
    w.add(cyl(.33, .21, M.black), cyl(.235, .215, M.rim), cyl(.05, .23, M.chrome));
    for (let a = 0; a < 5; a++) w.add(box(.022, .46, .008, M.dark, 0, 0, s * .109, 0, 0, a * Math.PI / 5 + .3));
    w.position.set(x, .33, z);
    return w;
  }

  function createPoliceCarTemplate() {
    const g = new THREE.Group(), add = (...o) => o.forEach(m => g.add(m));

    const bg = new THREE.ExtrudeGeometry(bodyProfile(), { depth: 1.75, bevelEnabled: true, bevelSegments: 3, steps: 1, bevelSize: .045, bevelThickness: .035 });
    bg.translate(0, 0, -.875);
    add(new THREE.Mesh(bg, M.white));
    add(box(4.4, .2, 1.5, M.black, -.05, .17, 0), box(1.8, .08, 1.84, M.black, -.1, .30, 0));

    // COMBI: nástavba se táhne téměř až k zadní hraně, záď je skoro svislá
    const gs = new THREE.Shape();
    gs.moveTo(-.95, .93); gs.lineTo(-.10, 1.42); gs.lineTo(.95, 1.45); gs.lineTo(1.65, 1.02);
    const gg = new THREE.ExtrudeGeometry(gs, { depth: 1.56, bevelEnabled: false });
    gg.translate(0, 0, -.78);
    add(new THREE.Mesh(gg, M.glass), box(1.10, .05, 1.58, M.white, .42, 1.44, 0));
    for (const z of [-.79, .79]) {
      add(box(.06, .98, .07, M.black, -.525, 1.18, z, 0, 0, -1.06),
          box(.08, .50, .07, M.black, .12, 1.18, z),
          box(.16, .82, .07, M.white, 1.30, 1.235, z, 0, 0, 1.02));
    }
    for (const z of [-1.0, 1.0]) add(box(.13, .09, .17, M.white, -.78, .99, z), box(.05, .04, .09, M.black, -.80, .96, z * .93));

    const PX = 400;
    const mk = flip => tex(1720, 312, x => {
      const X = v => (flip ? 2.15 - v : v + 2.15) * PX, Y = v => (1.02 - v) * PX;
      const poly = (c, p) => { x.fillStyle = c; x.beginPath(); p.forEach((q, i) => x[i ? 'lineTo' : 'moveTo'](X(q[0]), Y(q[1]))); x.closePath(); x.fill(); };
      x.fillStyle = '#06080a';
      AX.forEach(a => { x.beginPath(); x.arc(X(a), Y(.33), .41 * PX, 0, 7); x.fill(); });
      poly(BL, [[-.98, .925], [2.10, .925], [2.10, .805], [-.98, .805]]);
      [-1.55, -1.44, -1.33, -1.22, -1.11].forEach((v, i) => poly(i % 2 ? BL : LM, [[v, .85], [v + .10, .85], [v + .10, .76], [v, .76]]));
      const stripe = (b, c) => poly(c, [[b, .26], [b + .07, .26], [b + .27, .80], [b + .20, .80]]);
      [[-1.02, BL], [-.95, LM], [-.88, BL], [.45, BL], [.52, LM], [.59, BL]].forEach(s => stripe(s[0], s[1]));
      x.strokeStyle = 'rgba(0,0,0,.4)'; x.lineWidth = 3;
      [-.85, .12, 1.02].forEach(v => { x.beginPath(); x.moveTo(X(v), Y(.80)); x.lineTo(X(v), Y(.30)); x.stroke(); });
      x.fillStyle = '#aab0b5';
      [-.12, .86].forEach(v => x.fillRect(X(flip ? v + .14 : v), Y(.775), .14 * PX, .035 * PX));
      x.textBaseline = 'middle'; x.textAlign = 'left';
      x.fillStyle = '#fff'; x.font = 'bold 28px Arial'; spaced(x, 'POMÁHAT A CHRÁNIT', X(-.38), Y(.865), 2);
      x.font = 'bold 36px Arial'; x.fillText('158', X(1.93) - 30, Y(.865));
      x.strokeStyle = '#fff'; x.lineWidth = 4; x.beginPath(); x.arc(X(1.78), Y(.865), 17, 0, 7); x.stroke();
      x.fillStyle = '#111'; x.font = 'bold 52px Arial'; spaced(x, 'POLICIE', X(-.30), Y(.56), 6);
    });
    const sR = decal(4.3, .78, mk(false)); sR.position.set(0, .63, .9115);
    const sL = decal(4.3, .78, mk(true)); sL.position.set(0, .63, -.9115); sL.rotation.y = Math.PI;
    add(sR, sL);

    add(box(.06, .10, 1.30, M.black, -2.35, .36, 0));
    add(box(.05, .24, .64, M.black, -2.36, .60, 0));
    for (let i = -3; i <= 3; i++) add(box(.055, .20, .015, M.chrome, -2.375, .60, i * .085));
    add(box(.05, .03, .70, M.chrome, -2.35, .72, 0));
    for (const z of [-.66, .66]) {
      const ry = z > 0 ? -.30 : .30;
      add(box(.06, .11, .50, M.lamp, -2.285, .75, z, 0, ry, 0));
      add(box(.03, .025, .30, z < 0 ? M.beaconL : M.beaconR, -2.318, .70, z, 0, ry, 0));
      add(box(.04, .06, .18, M.lamp, -2.385, .36, z * .93));
    }
    const pt = tex(256, 56, x => {
      x.fillStyle = '#f3f3ee'; x.fillRect(0, 0, 256, 56);
      x.fillStyle = '#1747a8'; x.fillRect(0, 0, 26, 56);
      x.fillStyle = '#fff'; x.font = 'bold 14px Arial'; x.textAlign = 'center'; x.fillText('CZ', 13, 50);
      x.fillStyle = '#111'; x.font = 'bold 40px Arial'; x.textBaseline = 'middle'; x.fillText('1A1 0158', 148, 30);
    });
    const pF = decal(.52, .114, pt, false); pF.position.set(-2.39, .40, 0); pF.rotation.y = -Math.PI / 2;
    const pB = decal(.52, .114, pt, false); pB.position.set(2.375, .42, 0); pB.rotation.y = Math.PI / 2;
    add(pF, pB);

    // Zadní světla: dole na nárazníku + svislá po stranách výklopných dveří
    for (const z of [-.62, .62]) add(box(.05, .12, .42, M.red, 2.365, .88, z));
    add(box(.04, .26, 1.66, M.dark, 2.35, .40, 0));
    const rt = tex(350, 110, x => {
      x.font = 'bold 52px Arial'; x.textBaseline = 'middle'; x.textAlign = 'left'; x.fillStyle = '#111';
      spaced(x, 'POLICIE', 175, 55, 5);
    });
    const rd = decal(.70, .22, rt); rd.position.set(2.37, .72, 0); rd.rotation.y = Math.PI / 2; add(rd);

    const ht = tex(512, 256, x => {
      x.strokeStyle = '#5a6066'; x.lineWidth = 5; x.beginPath(); x.arc(256, 66, 40, 0, 7); x.stroke();
      x.lineWidth = 3;
      for (let a = 0; a < 8; a++) { x.beginPath(); x.moveTo(256, 66); x.lineTo(256 + 34 * Math.cos(a * Math.PI / 4), 66 + 34 * Math.sin(a * Math.PI / 4)); x.stroke(); }
      x.font = 'bold 84px Arial'; x.textBaseline = 'middle'; x.textAlign = 'left'; x.fillStyle = '#2a2e33';
      spaced(x, 'POLICIE', 256, 190, 8);
    });
    const hood = new THREE.Group();
    const hm = decal(.95, .475, ht); hm.rotation.x = -Math.PI / 2; hm.rotation.z = -Math.PI / 2;
    hood.add(hm); hood.position.set(-1.62, .915, 0); hood.rotation.z = .113; add(hood);

    AX.forEach(x => [-.85, .85].forEach(z => add(wheel(x, z))));

    const bar = new THREE.Group();
    bar.add(box(.30, .06, 1.22, M.rim),
      box(.26, .09, .44, M.beaconL, 0, .075, -.36),
      box(.26, .09, .44, M.beaconR, 0, .075, .36),
      box(.26, .08, .28, M.lamp, 0, .07, 0));
    bar.position.set(.30, 1.495, 0);
    add(bar);

    add(box(.02, .34, .02, M.black, .85, 1.635, -.5, 0, 0, -.10));

    g.position.y = .02;
    g.scale.set(0.90, 0.90, 0.90);
    return g;
  }


  return createPoliceCarTemplate;
  })();

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') go(-1);
      else if (e.key === 'ArrowRight') go(1);
      else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') setPolice(!police);
    });

    showModel();

    const dom = renderer.domElement;
    dom.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);
    dom.addEventListener('touchstart', onPointerDown, { passive: false });
    dom.addEventListener('touchmove', onPointerMove, { passive: false });
    dom.addEventListener('touchend', onPointerUp);
    window.addEventListener('resize', onWindowResize);
    animate();
  }

  function getClientCoordinates(e) {
    if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }
  function onPointerDown(e) {
    isDragging = true;
    const c = getClientCoordinates(e);
    previousMousePosition = { x: c.x, y: c.y };
    rotationVelocityY = 0; rotationVelocityX = 0;
    if (e.type === 'touchstart') e.preventDefault();
  }
  function onPointerMove(e) {
    if (!isDragging) return;
    const c = getClientCoordinates(e);
    rotationVelocityY = (c.x - previousMousePosition.x) * 0.005;
    rotationVelocityX = (c.y - previousMousePosition.y) * 0.005;
    targetRotationY += rotationVelocityY;
    targetRotationX += rotationVelocityX;
    targetRotationX = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, targetRotationX));
    previousMousePosition = { x: c.x, y: c.y };
    if (e.type === 'touchmove') e.preventDefault();
  }
  function onPointerUp() { isDragging = false; }
  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
  function animate() {
    requestAnimationFrame(animate);
    if (!isDragging) {
      rotationVelocityY *= 0.95; rotationVelocityX *= 0.95;
      targetRotationY += rotationVelocityY; targetRotationX += rotationVelocityX;
      if (Math.abs(rotationVelocityY) < 0.0001) targetRotationY += 0.003;
    }
    if (car) { car.rotation.y = targetRotationY; car.rotation.x = targetRotationX; }
    renderer.render(scene, camera);
  }

  init();
</script>
</body>
</html>
