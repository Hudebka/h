// --- SEGMENTOVY SYSTEM: veřejný registr, do kterého se externí soubory
// segments/segment_XXXX.js samy zapíší zavoláním PunkRunner.registerSegment().
// Musí být MIMO hlavní IIFE, protože segmentové soubory se načítají jako
// samostatné <script> tagy v globálním scope.
window.PunkRunner = window.PunkRunner || { segments: [] };
window.PunkRunner.registerSegment = function(seg){
  if(seg && Array.isArray(seg.items) && seg.items.length){
    window.PunkRunner.segments.push(seg);
  }
};
window.PunkRunner._loadErrors = [];
window.addEventListener('error', function(e){
  if(e && e.filename && e.filename.indexOf('segments/segment_') !== -1){
    const name = e.filename.split('/').pop();
    window.PunkRunner._loadErrors.push(name + ': ' + e.message);
    const dbg = document.getElementById('segDebug');
    if(dbg) dbg.textContent = '⚠️ chyba v ' + name + ' (' + e.message + ') - zbytek viz konzole';
  }
}, true);

  // PRUHY: silnice má 1 až 5 pruhů. Všechny pruhy leží na jedné pětipruhové
  // mřížce se středem v x=0: "gl" (global lane) je číslo pruhu na téhle mřížce,
  // x = (gl-2)*LANE_W. Tříproudá silnice tak používá gl = 1, 2, 3 (jako dřív
  // pruhy 0, 1, 2 na x = -2.3, 0, 2.3); dvou- a čtyřpruhová má pruhy na půl kroku.
  const LANE_W = 2.3, MAX_LANES = 5;
  const laneXOf = gl => (gl - 2) * LANE_W;
  const laneLo = n => (MAX_LANES - n) / 2;
  const clampN = n => Math.max(1, Math.min(MAX_LANES, Math.round(Number(n)||3)));

  // --- VESTAVĚNÉ SEGMENTY (záložní sada) ---------------------------------
  // Používají se vždy, dokud se nenačte alespoň jeden externí segment ze
  // složky segments/ (viz loadExternalSegments níže). Díky tomu je hra
  // hratelná i úplně bez editoru/externích souborů.
  // Formát segmentu: { id, length, items:[{type, lane, z, flipped?}] }
  //   - type:  'coin' | 'bottle' | 'puddle' | 'car'
  //   - lane:  0 = první pruh zleva ... lanes-1 = poslední (u 3 pruhů: 0 levý | 1 střed | 2 pravý)
  //   - lanes: (u segmentu) počet pruhů 1 až 5, výchozí 3
  //   - align: (u segmentu, volitelně) kam se silnice při změně počtu pruhů přikloní:
  //            'left' = drží levý okraj předchozí silnice, 'right' = pravý, 'center' = střed.
  //            Bez něj: při sudém rozdílu pruhů střed, při lichém (3 -> 2) se silnice přikloní
  //            k jedné straně (tou, která ji drží blíž středu hrací plochy; při shodě náhodně).
  //   - biome: (u segmentu, volitelně) vynutí prostředí: 'city' | 'forest' | 'bridge' | 'industry'.
  //            Bez něj se prostředí střídá samo po náhodně dlouhých úsecích (viz BIOMES).
  //   - type 'arrow_left' / 'arrow_right': šipka odbočky na zemi v daném pruhu.
  //            Kdo v tom pruhu šipku přeběhne, zatočí (celá scéna s ním).
  //   - z:     vzdálenost od ZAČÁTKU segmentu (0 = první věc, na kterou
  //            hráč v segmentu narazí; length = poslední)
  //   - flipped: u 'car' volitelně otočí auto o 180°
  //   - model:   u 'car' volitelně typ vozu: sedan_police (výchozí), combi_police,
  //              van_police, truck_police, sedan_civil, combi_civil, van_civil,
  //              truck_civil, jeep_civil, sport_civil, ramp_civil
  //              (civilní vozy dostanou ve hře náhodnou barvu)
  // Vestavěné segmenty - dohromady obsahují všechno, co hra umí:
  //   * 3 i 2 pruhy (hra mezi nimi sama vloží plynulý přechod),
  //   * odbočky vlevo i vpravo (šipka vždy v krajním pruhu: vpravo = pravý, vlevo = levý),

  const _arR = (lane, z) => [{type:'arrow_right', lane, z}];

  const DEFAULT_SEGMENTS = [

    { id:'default-10', name:'Dva pruhy: sedan a lahváče', length:30, lanes:2, items:[

    { id:'default-11', name:'Dva pruhy: combi a dodávka', length:34, lanes:2, items:[

  // nový segment stačí přidat jako další soubor s dalším číslem.
  function loadExternalSegments(){
    const FOLDER = 'segments/', MAX = 60;
    const dbg = document.getElementById('segDebug');
    let settled = 0, loaded = 0;
    function report(){
      if(!dbg) return;
      if(window.PunkRunner._loadErrors.length) return; // chybová hláška má přednost, nepřepisovat
      const list = window.PunkRunner.segments;
      const ext = list.length;
      dbg.textContent = 'segmenty: ' + DEFAULT_SEGMENTS.length + ' vestavěných + ' + ext + ' externích'
        + (ext>0 ? ' [' + list.map(s=>s.id).join(', ') + ']' : ' (segments/ nenalezena nebo prázdná)')
        + '  = pool ' + (DEFAULT_SEGMENTS.length + ext);
    }
    if(dbg) dbg.textContent = 'segmenty: načítám ze segments/ ...';
    for(let i=1;i<=MAX;i++){
      const num = String(i).padStart(4,'0');
      const s = document.createElement('script');
      s.src = FOLDER + 'segment_' + num + '.js';
      s.async = true;
      s.onload = function(){ loaded++; settled++; if(settled>=MAX) report(); };
      s.onerror = function(){ settled++; if(settled>=MAX) report(); };
      document.head.appendChild(s);
    }
    // Jistota i kdyby některý požadavek "settled" nikdy nenahlásil.
    setTimeout(report, 2000);

  const PEE_STOP_CHANCE = 0.3;
  const PEE_STOP_SEG = { id:'pee-stop', name:'Policejní auto (zastávka)', length:24, lanes:3, peeStop:true,
    items:[ { type:'car', lane:2, z:12, model:'sedan_police', flipped:true } ] };

    if(testSeg) return testSeg;
    if(!lastWasPeeStop && Math.random() < PEE_STOP_CHANCE){ lastWasPeeStop = true; return PEE_STOP_SEG; }

    const pool = segmentPool();
    if(pool.length===1) return pool[0];
    let seg, tries = 0;
    do{ seg = pool[Math.floor(Math.random()*pool.length)]; tries++; }
    while(seg.id===lastSegmentId && tries<10); // pojistka: kdyby měly dva segmenty stejné ID
    lastSegmentId = seg.id;

  function spawnItem(type, lane, worldZ, flipped, model){
    const x = laneXOf(lane);   // lane = globální pruh (gl)
    if(type==='puddle'){
      const mesh = createPuddle(); mesh.position.set(x, 0, worldZ);
      scene.add(mesh); obstacles.push({mesh, lane, jumpReq:0.15, zHalf:0.55, isPuddle:true});

      scene.add(mesh); obstacles.push({mesh, lane, info:car.info, flip:!!flipped, lenHalf:car.info.lenHalf, isPuddle:false});
    } else if(type==='coin'){
      const lift = surfaceAt(lane, worldZ, null).h;   // mince ve vozidle leží na jeho střeše
      const mesh = createCoin(); mesh.position.set(x, 0.7 + lift, worldZ);
      scene.add(mesh); coins.push({mesh, lane, collected:false, baseY:lift});

  let segRecs = [], segSeq = 0, segShownKey = null;
  function setSegLabel(rec){

  // Poloha nové silnice na pětipruhové mřížce (lo = číslo pruhu nejlevějšího pruhu) podle zarovnání
  // vůči předchozí silnici (viz 'align' výše).
  function pickLo(n, align){
    const pn = lastRoadN, plo = lastRoadLo;
    const clampLo = v => Math.max(0, Math.min(MAX_LANES - n, v));
    const cL = clampLo(plo), cR = clampLo(plo + pn - n), cM = clampLo(plo + (pn - n)/2);
    if(align === 'left') return cL;
    if(align === 'right') return cR;
    if(align === 'center') return cM;
    if(n === pn) return plo;
    if((pn - n) % 2 === 0) return cM;                       // sudý rozdíl: symetricky
    const dL = Math.abs(cL + (n-1)/2 - 2), dR = Math.abs(cR + (n-1)/2 - 2);   // vzdálenost středu silnice od středu plochy
    if(dL < dR) return cL;
    if(dR < dL) return cR;
    return Math.random() < 0.5 ? cL : cR;
  }
  function spawnSegment(seg){
    const zRecStart = spawnCursorZ;   // začátek segmentu včetně případného přechodu (taperu) před ním
    const its = seg.items||[];
    const n = clampN(seg.lanes), lo = pickLo(n, seg.align);
    const biome = biomeFor(seg);
    const glOf = it => lo + Math.max(0, Math.min(n-1, Math.round(Number(it.lane)||0)));
    const isMark = it => it.type==='arrow_left' || it.type==='arrow_right';
    const isSolid = it => it.type==='car' || it.type==='puddle';
    const segLen = Math.max(6, seg.length||20);
    // Silnice tohoto segmentu (šířka podle počtu pruhů) + šipky / křižovatky.
    // Jiný počet pruhů než předchozí segment: mezi ně se vloží lichoběžníkový přechod
    // (silnice se plynule zužuje / rozšiřuje i s obrubníky), ne skokový schod.
    if(n !== lastRoadN || lo !== lastRoadLo){ buildTaper(lastRoadN, lastRoadLo, n, lo, spawnCursorZ, biome); spawnCursorZ -= TAPER_LEN; }
    buildSegmentRoad(n, lo, spawnCursorZ, spawnCursorZ - segLen - SEGMENT_GAP,
      its.filter(isMark).map(it=>({ dir: it.type==='arrow_left' ? -1 : 1, gl: glOf(it), z: spawnCursorZ - (it.z||0) })), biome);
    const things = its.filter(it=>!isMark(it));
    things.filter(isSolid).concat(things.filter(it=>!isSolid(it))).forEach(it=>{
      spawnItem(it.type, glOf(it), spawnCursorZ - (it.z||0), !!it.flipped, it.model);
    });
    if(seg.peeStop){ const car = obstacles[obstacles.length-1]; if(car){ car.pcr = true; car.peeStopFlash = false; } }   // pcr = jediné auto, do kterého se dá "močit"; false = ještě nezablikalo
    lastRoadN = n; lastRoadLo = lo;
    spawnCursorZ -= segLen + SEGMENT_GAP; // + prázdná mezera mezi segmenty
    spawnCounts[seg.id] = (spawnCounts[seg.id]||0) + 1;
    segRecs.push({ key:++segSeq, text:'▸ segment ' + seg.id + '  (' + (seg.items||[]).length + ' položek, délka ' + (seg.length||'?') + ')', z0:zRecStart, z1:spawnCursorZ });
  }

  const BASE_FOV = 60, LANE_HALF_MAX = 2.3, LANE_MARGIN = 1.0;
  function fitFov(){
    if(!camera) return;

  function blobShape(baseR){
    // Nepravidelný obrys místo dokonalého kruhu - náhodný poloměr v každém
    // bodě dělá z každé kaluže jiný, "rozlitý" tvar.
    const shape = new THREE.Shape();
    const N = 10;
    for(let i=0;i<=N;i++){
      const a = (i/N)*Math.PI*2;
      const r = baseR * (0.72 + Math.random()*0.5);
      const x = Math.cos(a)*r, y = Math.sin(a)*r;
      if(i===0) shape.moveTo(x,y); else shape.lineTo(x,y);
    }
    shape.closePath();
    return shape;
  }

  function createPuddle(){
    // Kaluž = skupina dvou nepravidelných "kaluží" nad sebou (světlejší podklad
    // + tmavší, posunuté jádro) => dojem hloubky/lesku místo ploché barvy.
    // Barevný odstín je navíc pokaždé mírně jiný (náhodné HSL).
    const g = new THREE.Group();
    const hue = 0.12 + Math.random()*0.05;
    const baseColor = new THREE.Color().setHSL(hue, 0.7, 0.4 + Math.random()*0.1);
    const innerColor = baseColor.clone().offsetHSL(0, 0.05, -0.14);

    const outer = new THREE.Mesh(
      new THREE.ShapeGeometry(blobShape(0.85 + Math.random()*0.25), 12),
      new THREE.MeshPhongMaterial({color:baseColor, specular:0xffffff, shininess:130, transparent:true, opacity:0.78})
    );
    outer.rotation.x = -Math.PI/2; outer.position.y = 0.015; g.add(outer);

    const inner = new THREE.Mesh(
      new THREE.ShapeGeometry(blobShape(0.5 + Math.random()*0.2), 10),
      new THREE.MeshPhongMaterial({color:innerColor, specular:0xffffff, shininess:170, transparent:true, opacity:0.72})
    );
    inner.rotation.x = -Math.PI/2;
    inner.position.set((Math.random()-0.5)*0.25, 0.02, (Math.random()-0.5)*0.25);
    g.add(inner);

    g.rotation.y = Math.random()*Math.PI*2;
    const s = 0.85 + Math.random()*0.35;
    g.scale.set(s, 1, s);
    return g;
  }

  // Vytaženo z herní smyčky do vlastní funkce, aby šlo stejným kódem "narovnat"
  // postavu i na úvodní obrazovce (viz volání níže) - dřív se nohy/pánev
  // dopočítaly (pelvis.position.y = -low) jen během běhu, takže na startu
  // postava neměla nastavené -low a vypadala "utopená v zemi".
  function applyPose(){
    const S = Math.sin(phase);
    let low = 0;
    legs.forEach((L, i) => {
      const p = phase + (i ? Math.PI : 0), q = legPose(p);
      L.hip.rotation.x = -q.f; L.knee.rotation.x = q.k; L.ankle.rotation.x = q.a;
      low = Math.min(low, footInfo(p).low);
    });
    pelvis.position.y = -low;
    pelvis.position.x = Math.sin(phase) * 0.012;
    pelvis.rotation.y = 0.12 * S;

    torso.rotation.x = 0.2 + 0.025 * Math.cos(phase * 2);
    torso.rotation.y = -0.24 * S;
    torso.rotation.z = 0.025 * Math.cos(phase);
    headGrp.rotation.x = -0.17 - 0.02 * Math.cos(phase * 2);
    headGrp.rotation.y = 0.14 * S;
    headGrp.rotation.z = -torso.rotation.z;

    arms.forEach((A, i) => {
      const pa = phase + (i ? 0 : Math.PI), s = Math.sin(pa);
      A.sh.rotation.x = -(0.1 + 0.75 * s);
      A.sh.rotation.z = A.side * 0.1;
      A.el.rotation.x = -(1.35 + 0.4 * s);
    });

    spikes.forEach(sp => {
      sp.rotation.x = sp.userData.base - 0.1 + 0.1 * Math.sin(T * 13 + sp.userData.i * 0.7) + 0.08 * Math.cos(phase * 2);
    });
  }

    const batonMat = new THREE.MeshStandardMaterial({ color: 0x1b1b1b, roughness: 0.4, metalness: 0.3 });
    const batonGripMat = new THREE.MeshStandardMaterial({ color: 0x2e2e2e, roughness: 0.6 });
    copBaton = new THREE.Group();
    const batonShaft = tube(0.022, 0.022, 0.42, batonMat, 10); batonShaft.position.y = -0.21; copBaton.add(batonShaft);
    const batonGrip = tube(0.028, 0.028, 0.12, batonGripMat, 10); batonGrip.position.y = 0.06; copBaton.add(batonGrip);
    copBaton.position.set(0, -0.30, 0.04);
    copBaton.rotation.x = -0.25;
    copArms[1].el.add(copBaton);

    copHeadGrp = new THREE.Group(); copHeadGrp.position.y = 0.7; copTorso.add(copHeadGrp);
    copHeadGrp.add(ball(0.205, skin, 0, 0.15, 0.01, 0.98, 1.02, 1));
    copHeadGrp.add(ball(0.15, skin, 0, 0.02, 0.06, 1.0, 0.85, 1));
    const nose = new THREE.Mesh(new THREE.ConeGeometry(0.028, 0.06, 8), skin); nose.rotation.x = Math.PI / 2 - 0.15; nose.position.set(0, 0.13, 0.22); copHeadGrp.add(nose);
    const mustache = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.025, 0.02), hair); mustache.position.set(0, 0.075, 0.205); copHeadGrp.add(mustache);
    [-1, 1].forEach(sd => {
      copHeadGrp.add(ball(0.042, skin, sd * 0.185, 0.15, 0, 0.5, 1, 0.9));
      copHeadGrp.add(ball(0.017, cdark, sd * 0.08, 0.18, 0.193, 1.2, 0.8, 0.6));
      const br = new THREE.Mesh(new THREE.BoxGeometry(0.065, 0.012, 0.02), hair); br.position.set(sd * 0.08, 0.22, 0.19); br.rotation.set(0, -sd * 0.1, sd * 0.08); copHeadGrp.add(br);
    });
    const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.01, 0.02), new THREE.MeshBasicMaterial({ color: 0x7a3b30 })); mouth.position.set(0, 0.025, 0.195); copHeadGrp.add(mouth);
    const hairPatch = new THREE.Mesh(new THREE.SphereGeometry(0.207, 16, 12, 0, Math.PI * 2, Math.PI * 0.42, Math.PI * 0.4), hair);
    hairPatch.position.set(0, 0.16, -0.005); copHeadGrp.add(hairPatch);

    const capGrp = new THREE.Group(); capGrp.position.set(0, 0.31, -0.01); copHeadGrp.add(capGrp);
    const band = new THREE.Mesh(new THREE.CylinderGeometry(0.205, 0.212, 0.07, 24), navy); band.position.y = 0.035; capGrp.add(band);
    const bandTrim = new THREE.Mesh(new THREE.TorusGeometry(0.212, 0.006, 6, 24), gold); bandTrim.rotation.x = Math.PI / 2; bandTrim.position.y = 0.068; capGrp.add(bandTrim);
    const saucer = new THREE.Mesh(new THREE.CylinderGeometry(0.255, 0.235, 0.05, 24), navy); saucer.position.y = 0.09; capGrp.add(saucer);
    const saucerTop = new THREE.Mesh(new THREE.CircleGeometry(0.255, 24), navy); saucerTop.rotation.x = -Math.PI / 2; saucerTop.position.y = 0.115; capGrp.add(saucerTop);
    const saucerEdge = new THREE.Mesh(new THREE.TorusGeometry(0.255, 0.006, 6, 24), cdark); saucerEdge.rotation.x = Math.PI / 2; saucerEdge.position.y = 0.113; capGrp.add(saucerEdge);
    const peak = new THREE.Mesh(new THREE.CylinderGeometry(0.205, 0.205, 0.016, 28), peakMat);
    peak.scale.set(1, 1, 0.39); peak.rotation.x = -0.08; peak.position.set(0, -0.01, 0.25); capGrp.add(peak);
    const capBadge = new THREE.Mesh(new THREE.CircleGeometry(0.026, 16), gold); capBadge.position.set(0, 0.04, 0.211); capGrp.add(capBadge);
    const capBadgeRim = new THREE.Mesh(new THREE.RingGeometry(0.026, 0.032, 16), gold); capBadgeRim.position.set(0, 0.04, 0.2105); capGrp.add(capBadgeRim);
    const strap = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.02, 0.006), cdark); strap.position.set(0, 0.02, 0.19); capGrp.add(strap);
    [-1, 1].forEach(sd => { const btn = new THREE.Mesh(new THREE.SphereGeometry(0.012, 8, 8), gold); btn.position.set(sd * 0.205, 0.02, 0.16); capGrp.add(btn); });
  }

  // Běžecká animace policisty - stejný princip jako applyPose() u punkáče,
  // jen bez bodlin (spikes) a s vlastními copLegs/copArms/copPelvis/... referencemi.
  function applyCopPose(p){
    const S = Math.sin(p);
    let low = 0;
    copLegs.forEach((L, i) => {
      const pp = p + (i ? Math.PI : 0), q = legPose(pp);
      L.hip.rotation.x = -q.f; L.knee.rotation.x = q.k; L.ankle.rotation.x = q.a;
      low = Math.min(low, footInfo(pp).low);
    });
    copPelvis.position.y = -low;
    copPelvis.position.x = Math.sin(p) * 0.012;
    copPelvis.rotation.y = 0.1 * S;
    copTorso.rotation.x = 0.16 + 0.02 * Math.cos(p * 2);
    copTorso.rotation.y = -0.2 * S;
    copTorso.rotation.z = 0.02 * Math.cos(p);
    copHeadGrp.rotation.x = -0.13 - 0.015 * Math.cos(p * 2);
    copHeadGrp.rotation.y = 0.11 * S;
    copHeadGrp.rotation.z = -copTorso.rotation.z;
    copArms.forEach((A, i) => {
      const pa = p + (i ? 0 : Math.PI), s = Math.sin(pa);
      A.sh.rotation.x = -(0.1 + 0.65 * s);
      A.sh.rotation.z = A.side * 0.12;
      A.el.rotation.x = -(1.25 + 0.35 * s);
    });
  }


  // =====================================================================
  // VÍCE PRUHŮ, KŘIŽOVATKY (ODBOČKY) A POLICEJNÍ ZASTÁVKA
  // =====================================================================
  const roadWidth = n => n*LANE_W + 0.7;      // 3 pruhy = 7.6 (stejně jako dřív)
  // Levý / pravý okraj asfaltu (světové x) silnice o n pruzích, jejíž nejlevější pruh je lo.
  const edgesOf = (n, lo) => ({ l: laneXOf(lo) - LANE_W/2 - 0.35, r: laneXOf(lo + n - 1) + LANE_W/2 + 0.35 });
  const STUB_LEN = 26;                         // délka boční ulice za křižovatkou
  const TAPER_LEN = 12;                        // délka plynulého přechodu mezi různou šířkou silnice
  // POLICEJNÍ AUTA: náraz zboku (přeřazení do jeho pruhu, když je hráč vedle něj), pokud hráč má
  // lahváč a v obraze není policista = cut scéna s močením; náraz zezadu / zepředu = game over.
  // Cut scéna platí JEN pro auto ze speciálního segmentu 'pee-stop' (viz pickSegment), které žlutě zabliká; ostatní policejní auta jsou jen překážky.
  // Každý lahváč = PEE_SEC_PER_BOTTLE sekund močení = PEE_POINTS_PER_BOTTLE bodů (jeden bod za 0,5 s).
  const PEE_SEC_PER_BOTTLE = 0.5, PEE_POINTS_PER_BOTTLE = 1;
  const PCR_SIDE_LEAD = 2.0, PCR_SIDE_TAIL = 2.0;   // o kolik jednotek dřív / později než přesně vedle auta se ještě počítá náraz zboku
  const PCR_SIDE_DEPTH = 1.6;                      // hlouběji než tohle do auta = náraz zboku, ne zezadu
  const TURN_DUR = 0.85;                       // délka zatáčení kamery
  const TURN_YAW_DUR = 0.36;                   // postava se otočí rychleji než kamera (nejdřív tělo, pak za ním pohled)
  let roadPieces = [];
  let roadN = 3, lastRoadN = 3, roadLo = 1, lastRoadLo = 1, camZoom = 1, camCX = 0, camTargetX = 0;
  let holdSpawn = false, parkedCar = null, turnAnim = null, turnYaw = 0, cutKeep = false, cutBiome = 'city';

  const ROAD_MAT = new THREE.MeshLambertMaterial({color:0x2b2b33});
  const CURB_MAT = new THREE.MeshLambertMaterial({color:0xe8e8e8});
  const DASH_MAT = new THREE.MeshBasicMaterial({color:0xffffff});
  const CAP_MAT  = new THREE.MeshLambertMaterial({color:0x11131a});
  const DASH_GEO_Z = new THREE.BoxGeometry(0.1,0.04,1.3); DASH_GEO_Z.userData.shared = true;
  const DASH_GEO_X = new THREE.BoxGeometry(1.3,0.04,0.1); DASH_GEO_X.userData.shared = true;
  const ARROW_GEO  = new THREE.PlaneGeometry(1.5,3.0);    ARROW_GEO.userData.shared = true;
  let arrowMat = null;
  function getArrowMat(){
    if(arrowMat) return arrowMat;
    // Šipka odbočky jako na silnici: dřík zespodu, oblouk doleva a hrot (pravá = zrcadlově).
    const c = document.createElement('canvas'); c.width = 128; c.height = 256;
    const x = c.getContext('2d');
    x.fillStyle = '#f2f2f2'; x.strokeStyle = '#f2f2f2'; x.lineWidth = 24; x.lineCap = 'butt'; x.lineJoin = 'miter';
    x.beginPath(); x.moveTo(84,256); x.lineTo(84,150); x.quadraticCurveTo(84,96,44,96); x.lineTo(30,96); x.stroke();
    x.beginPath(); x.moveTo(2,96); x.lineTo(44,62); x.lineTo(44,130); x.closePath(); x.fill();
    arrowMat = new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c), transparent:true, depthWrite:false, side:THREE.DoubleSide});
    return arrowMat;
  }

  function disposePiece(p){
    p.g.traverse(o=>{ if(o.geometry && !(o.geometry.userData && o.geometry.userData.shared)) o.geometry.dispose(); });
  }

  // Úseky obrubníku bez mezer (mezery = vjezdy do bočních ulic).
  function curbRuns(a0, b0, gaps){
    let runs = [[a0, b0]];
    gaps.forEach(([ga, gb])=>{
      const next = [];
      runs.forEach(([a, b])=>{
        if(gb >= a || ga <= b){ next.push([a, b]); return; }
        if(a > ga) next.push([a, ga]);
        if(gb > b) next.push([gb, b]);
      });
      runs = next;
    });
    return runs.filter(r => r[0]-r[1] > 0.05);
  }

  // Boční ulice za křižovatkou. Kdo odbočí, doběhne v ní do nově vysazované trati.
  function makeStub(n, dir, zJ, biome, cx){
    const W = roadWidth(n), L = STUB_LEN;
    const g = new THREE.Group();
    g.position.set(cx + dir*(W/2 + L/2), 0, zJ);
    const plane = new THREE.Mesh(new THREE.PlaneGeometry(L, W), ROAD_MAT);
    plane.rotation.x = -Math.PI/2; g.add(plane);
    [-1,1].forEach(sd=>{
      const m = new THREE.Mesh(new THREE.BoxGeometry(L,0.3,0.3), CURB_MAT);
      m.position.set(0, 0.1, sd*(W/2+0.15)); g.add(m);
    });
    const pts = [];
    for(let k=0;k<n-1;k++){ const zz = (k+1-n/2)*LANE_W; for(let xx=-L/2+2; xx<L/2-0.7; xx+=4) pts.push([xx, zz]); }
    if(pts.length){
      const im = new THREE.InstancedMesh(DASH_GEO_X, DASH_MAT, pts.length), mt = new THREE.Matrix4();
      pts.forEach((p,i)=>{ mt.makeTranslation(p[0], 0.03, p[1]); im.setMatrixAt(i, mt); });
      im.instanceMatrix.needsUpdate = true; im.frustumCulled = false; g.add(im);
    }
    // Zeď na konci (jen dokud do ulice nikdo neodbočil - vypadá to jako slepá ulička).
    const cap = new THREE.Mesh(new THREE.BoxGeometry(0.6,5,W+1.2), CAP_MAT);
    cap.position.set(dir*(L/2+0.3), 2.5, 0); g.add(cap);
    dressPiece(g, biome, L, [-W/2,-W/2], [W/2,W/2], dir, [], 12);   // prvních 12 jednotek lemují domy staré silnice
    scene.add(g);
    const piece = { g, n, lo:laneLo(n), hx:L/2, hz:W/2, xl0:-W/2, xl1:-W/2, xr0:W/2, xr1:W/2,
      rot:false, isStub:true, cap, arrows:[], biome };
    roadPieces.push(piece);
    return piece;
  }

  // Přechod mezi dvěma polohami / šířkami silnice (lichoběžník, i nesymetrický: okraj, který
  // zůstává, jde rovně, druhý se šikmo přibližuje / vzdaluje). Pro hráče platí užší z obou
  // konfigurací pruhů (přesune se dřív, než se pruh ztratí).
  function buildTaper(nA, loA, nB, loB, zNear, biome){
    const eA = edgesOf(nA, loA), eB = edgesOf(nB, loB), L = TAPER_LEN, cz = zNear - L/2;
    const g = new THREE.Group();
    g.position.set(0, 0, cz);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute([ eA.l,0,L/2,  eA.r,0,L/2,  eB.r,0,-L/2,  eB.l,0,-L/2 ], 3));
    geo.setIndex([0,1,2, 0,2,3]);
    geo.computeVertexNormals();
    g.add(new THREE.Mesh(geo, ROAD_MAT));
    [[eA.l-0.15, eB.l-0.15], [eA.r+0.15, eB.r+0.15]].forEach(([x0, x1])=>{
      const dx = x1 - x0, len = Math.hypot(dx, L);
      const m = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.3,len+0.05), CURB_MAT);
      m.position.set((x0+x1)/2, 0.1, 0);
      m.rotation.y = Math.atan2(dx, -L);
      g.add(m);
    });
    dressPiece(g, biome, L, [eA.l, eB.l], [eA.r, eB.r], 0, []);
    scene.add(g);
    const nar = nB <= nA ? { n:nB, lo:loB } : { n:nA, lo:loA };
    const piece = { g, n:nar.n, lo:nar.lo, hx:Math.max(eA.r-eA.l, eB.r-eB.l)/2, hz:L/2,
      xl0:eA.l, xr0:eA.r, xl1:eB.l, xr1:eB.r, rot:false, isStub:false, arrows:[], biome };
    roadPieces.push(piece);
    return piece;
  }

  // Silnice jednoho segmentu: plocha, obrubníky (s mezerami u odboček), čárkované
  // dělicí čáry, šipky a boční ulice. zNear > zFar jsou světové souřadnice.
  function buildSegmentRoad(n, lo, zNear, zFar, marks, biome){
    biome = biome || 'city';
    const W = roadWidth(n), len = zNear - zFar, cz = (zNear + zFar)/2;
    const e = edgesOf(n, lo), cx = (e.l + e.r)/2;
    const juncMap = {}, arrowList = [];
    marks.forEach(m=>{
      const z = Math.min(m.z, zNear - W/2 - 0.1);          // křižovatka se musí vejít do segmentu
      const key = m.dir + '@' + z.toFixed(2);
      if(!juncMap[key]) juncMap[key] = { dir:m.dir, z, stub:null };
      arrowList.push({ lane:m.gl, dir:m.dir, z, j:juncMap[key] });
    });
    const juncs = Object.keys(juncMap).map(k=>juncMap[k]);

    const g = new THREE.Group();
    g.position.set(0, 0, cz);
    const plane = new THREE.Mesh(new THREE.PlaneGeometry(W, len), ROAD_MAT);
    plane.rotation.x = -Math.PI/2; plane.position.x = cx; g.add(plane);

    [-1,1].forEach(side=>{
      const gaps = juncs.filter(j=>j.dir===side).map(j=>[j.z + W/2, j.z - W/2]);
      curbRuns(zNear, zFar, gaps).forEach(([a,b])=>{
        const m = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.3,a-b), CURB_MAT);
        m.position.set(cx + side*(W/2+0.15), 0.1, (a+b)/2 - cz); g.add(m);
      });
    });

    const pts = [];
    for(let k=0;k<n-1;k++){
      const x = laneXOf(lo + k) + LANE_W/2;                // dělicí čára mezi pruhem k a k+1
      for(let z=zNear-2; z>zFar+0.7; z-=4){
        if(juncs.some(j=>z < j.z + W/2 && z > j.z - W/2)) continue;   // v křižovatce se čáry nekreslí
        pts.push([x, z]);
      }
    }
    if(pts.length){
      const im = new THREE.InstancedMesh(DASH_GEO_Z, DASH_MAT, pts.length), mt = new THREE.Matrix4();
      pts.forEach((p,i)=>{ mt.makeTranslation(p[0], 0.03, p[1]-cz); im.setMatrixAt(i, mt); });
      im.instanceMatrix.needsUpdate = true; im.frustumCulled = false; g.add(im);
    }

    arrowList.forEach(a=>{
      const m = new THREE.Mesh(ARROW_GEO, getArrowMat());
      m.rotation.x = -Math.PI/2; m.scale.x = a.dir < 0 ? 1 : -1;
      m.position.set(laneXOf(a.lane), 0.045, a.z - cz); g.add(m);
    });

    // Scenérie podél silnice; u křižovatky se na dané straně vynechá, aby domy neblokovaly boční ulici.
    dressPiece(g, biome, len, [e.l, e.l], [e.r, e.r], 0,
      juncs.map(j=>({ side:j.dir, t0:(zNear - j.z) - W/2 - 1.5, t1:(zNear - j.z) + W/2 + 1.5 })));
    scene.add(g);
    juncs.forEach(j=>{ j.stub = makeStub(n, j.dir, j.z, biome, cx); });
    const piece = { g, n, lo, hx:W/2, hz:len/2, xl0:e.l, xl1:e.l, xr0:e.r, xr1:e.r, rot:false, isStub:false, biome,
      arrows: arrowList.map(a=>({ lane:a.lane, dir:a.dir, lz:a.z - cz, used:false, stub:a.j.stub })) };
    roadPieces.push(piece);
    return piece;
  }

  // Největší poloviční šířka silnice na úseku z0..z1 (svět. z). Dům tak drží odstup
  // od nejširšího místa, které se ho po celé hloubce dotýká.
  function roadHalfOver(z0, z1){
    let best = 0, hit = false;
    for(const p of roadPieces){
      if(p.rot || p.isStub || p.wNear === undefined) continue;
      const c = p.g.position.z, near = c + p.hz, far = c - p.hz;
      const a = Math.max(far, z0), b = Math.min(near, z1);
      if(a > b) continue;
      hit = true;
      const wAt = z => p.wNear + (p.wFar - p.wNear)*((near - z)/(2*p.hz));
      best = Math.max(best, wAt(a), wAt(b));
    }
    return hit ? best/2 : roadWidth(lastRoadN)/2;
  }

  // =====================================================================
  // PROSTŘEDÍ (MAPY): město, les, most, průmysl ...
  // Prostředí se střídá po náhodně dlouhých úsecích segmentů (min-max v tabulce).
  // Scenérie (terén, domy, stromy, zábradlí ...) je potomkem kousku silnice, takže
  // se s ním pohybuje, otáčí při odbočce a mizí spolu s ním. Nové prostředí přidáš
  // záznamem v BIOMES + funkcí, která vyrobí jeden prvek (viz makeTree).
  // =====================================================================
  const BIOMES = {
    city:     { name:'Město',   ground:0x14161f, fog:0x0f1220, min:6, max:12 },
    forest:   { name:'Les',     ground:0x0e2214, fog:0x0a1a12, min:4, max:8  },
    bridge:   { name:'Most',    ground:0x0a2a48, fog:0x0b1830, min:2, max:4, water:true },
    industry: { name:'Průmysl', ground:0x1d1c1b, fog:0x17161b, min:3, max:6  }
  };
  const BIOME_IDS = Object.keys(BIOMES);
  let bioCur = 'city', bioLeft = 0;
  const bRnd = (a, b) => a + Math.random()*(b - a);
  const bRndInt = (a, b) => Math.floor(a + Math.random()*(b - a + 1));
  function resetBiomes(){ bioCur = 'city'; bioLeft = bRndInt(BIOMES.city.min, BIOMES.city.max); }
  function biomeFor(seg){
    if(seg && seg.biome && BIOMES[seg.biome]) return seg.biome;   // segment si prostředí vynutil
    if(bioLeft <= 0){
      const others = BIOME_IDS.filter(id => id !== bioCur);
      bioCur = others[Math.floor(Math.random()*others.length)];
      bioLeft = bRndInt(BIOMES[bioCur].min, BIOMES[bioCur].max);
    }
    bioLeft--;
    return bioCur;
  }

  const shG = g => { g.userData.shared = true; return g; };            // sdílená geometrie se neuvolňuje
  const lamM = c => new THREE.MeshLambertMaterial({color:c});
  const basM = c => new THREE.MeshBasicMaterial({color:c});

  function windowTexture(cols, rows){
    const cw=16, ch=16;
    const c = document.createElement('canvas'); c.width=cols*cw; c.height=rows*ch;
    const cx = c.getContext('2d');
    cx.fillStyle = '#12141c'; cx.fillRect(0,0,c.width,c.height);
    for(let r=0;r<rows;r++){
      for(let col=0;col<cols;col++){
        const lit = Math.random() < 0.22;
        cx.fillStyle = lit ? (Math.random()<0.5?'#ffe9a8':'#bfe3ff') : '#232838';
        cx.fillRect(col*cw+3, r*ch+3, cw-6, ch-6);
      }
    }
    return new THREE.CanvasTexture(c);
  }

  // ---- MĚSTO: domy (sdílené materiály oken a geometrie, jen se náhodně škálují)
  let CITY = null;
  function cityKinds(){
    if(!CITY){
      CITY = [[5,8],[6,12],[7,10],[8,14],[9,12],[10,16],[6,8],[8,10]].map(([c,r])=>{
        const w = c/2.2, h = r/1.8;
        return { w, h, geo: shG(new THREE.BoxGeometry(w,h,w)), mat: new THREE.MeshBasicMaterial({map:windowTexture(c,r)}) };
      });
    }
    return CITY;
  }
  function makeCityDecor(){
    const ks = cityKinds(), k = ks[Math.floor(Math.random()*ks.length)];
    const b = new THREE.Mesh(k.geo, [k.mat,k.mat,CAP_MAT,CAP_MAT,k.mat,k.mat]);
    const sx = bRnd(0.9,1.2), sy = bRnd(0.85,1.25);
    b.scale.set(sx, sy, sx);
    return { obj:b, d:k.w*sx, lat:k.w*sx/2, y:k.h*sy/2, off:bRnd(0,3.2), gap:[1.5,5] };
  }

  // ---- LES: jehličnaté stromy
  let TREE = null;
  function makeTree(){
    if(!TREE) TREE = {
      trunk: shG(new THREE.CylinderGeometry(0.16,0.22,1.2,6)),
      c1: shG(new THREE.ConeGeometry(1.15,2.0,7)), c2: shG(new THREE.ConeGeometry(0.85,1.7,7)),
      tm: lamM(0x4a3320), gm: [lamM(0x1d5a2c), lamM(0x246b34), lamM(0x174a25), lamM(0x2a7a3a)]
    };
    const g = new THREE.Group(), gm = TREE.gm[Math.floor(Math.random()*TREE.gm.length)];
    const t = new THREE.Mesh(TREE.trunk, TREE.tm); t.position.y = 0.6; g.add(t);
    const c1 = new THREE.Mesh(TREE.c1, gm); c1.position.y = 1.9; g.add(c1);
    const c2 = new THREE.Mesh(TREE.c2, gm); c2.position.y = 3.0; g.add(c2);
    const s = bRnd(0.8,1.7);
    g.scale.set(s, s*bRnd(0.9,1.3), s);
    return { obj:g, d:2.2*s, lat:1.1*s, y:0, off:bRnd(0.3,4), gap:[0.4,2.2] };
  }

  // ---- PRŮMYSL: haly, nádrže, komíny, kontejnery
  let IND = null;
  function makeIndustry(){
    if(!IND) IND = {
      wall: [lamM(0x3d424b), lamM(0x4a4f58), lamM(0x343a42)], roof: lamM(0x22262c),
      tank: lamM(0x6c7078), chim: lamM(0x58514c), red: basM(0xff3a2a),
      cont: [lamM(0xb23a2a), lamM(0x2a5fa8), lamM(0x3a8a4a), lamM(0xc89a2a)]
    };
    const pick = a => a[Math.floor(Math.random()*a.length)];
    const g = new THREE.Group(), r = Math.random();
    let d, lat;
    if(r < 0.35){                                    // hala
      const w = bRnd(4,7), h = bRnd(2.4,4), dep = bRnd(5,9);
      const body = new THREE.Mesh(new THREE.BoxGeometry(w,h,dep), pick(IND.wall)); body.position.y = h/2; g.add(body);
      const roof = new THREE.Mesh(new THREE.BoxGeometry(w+0.2,0.25,dep+0.2), IND.roof); roof.position.y = h+0.12; g.add(roof);
      d = dep; lat = w/2;
    } else if(r < 0.6){                              // nádrž
      const rad = bRnd(1.5,2.4), h = bRnd(3,5);
      const t = new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,h,14), IND.tank); t.position.y = h/2; g.add(t);
      const top = new THREE.Mesh(new THREE.CylinderGeometry(rad*0.9,rad,0.3,14), IND.roof); top.position.y = h+0.15; g.add(top);
      d = rad*2; lat = rad;
    } else if(r < 0.8){                              // komín s výstražným světlem
      const h = bRnd(9,13), rad = bRnd(0.5,0.8);
      const c = new THREE.Mesh(new THREE.CylinderGeometry(rad*0.7,rad,h,10), IND.chim); c.position.y = h/2; g.add(c);
      const l = new THREE.Mesh(new THREE.SphereGeometry(0.22,8,6), IND.red); l.position.y = h+0.2; g.add(l);
      d = rad*2+0.5; lat = rad;
    } else {                                         // kontejnery
      const m = pick(IND.cont), lv = Math.random() < 0.5 ? 1 : 2;
      for(let i=0;i<lv;i++){
        const c = new THREE.Mesh(new THREE.BoxGeometry(2.4,2.5,6), pick(IND.cont)); c.position.y = 1.25 + i*2.5; g.add(c);
      }
      d = 6; lat = 1.2;
    }
    return { obj:g, d, lat, y:0, off:bRnd(0.2,3.5), gap:[2,6] };
  }

  // ---- Pásový souřadný systém kousku: t = vzdálenost podél silnice od jeho začátku,
  // x = napříč, z = -t. Pro boční ulice (osa X) se pás pootočí.
  function makeStrip(g, len, dir){
    const sg = new THREE.Group();
    if(dir > 0){ sg.position.set(-len/2, 0, 0); sg.rotation.y = -Math.PI/2; }        // boční ulice vpravo: t roste doprava
    else if(dir < 0){ sg.position.set(len/2, 0, 0); sg.rotation.y = Math.PI/2; }     // vlevo: t roste doleva (t=0 vždy u hlavní silnice)
    else sg.position.set(0, 0, len/2);
    g.add(sg);
    return sg;
  }
  function quadGeo(xl0, xr0, xl1, xr1, len){
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute([ xl0,0,0, xr0,0,0, xr1,0,-len, xl1,0,-len ], 3));
    geo.setIndex([0,1,2, 0,2,3]);
    geo.computeVertexNormals();
    return geo;
  }

  const GROUND_MATS = {};
  function addGround(sg, biome, len){
    const B = BIOMES[biome];
    if(!GROUND_MATS[biome]) GROUND_MATS[biome] = B.water ? basM(B.ground) : lamM(B.ground);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(B.water ? 160 : 90, len), GROUND_MATS[biome]);
    m.rotation.x = -Math.PI/2;
    m.position.set(0, B.water ? -4.5 : -0.015, -len/2);
    sg.add(m);
  }

  // ---- MOST: paluba, zábradlí s patkami a lampy. Mezery (gaps) = vjezdy do bočních ulic.
  let BR = null;
  function bridgeStrip(sg, len, eL, eR, gaps){
    if(!BR) BR = {
      deck: lamM(0x3b3f4a), rail: lamM(0xa9b1bd), post: lamM(0x6f7683), pole: lamM(0x2c2f36), lamp: basM(0xffe9a8),
      postG: shG(new THREE.BoxGeometry(0.14,1.2,0.14)), poleG: shG(new THREE.CylinderGeometry(0.07,0.09,5,6)),
      armG: shG(new THREE.BoxGeometry(0.9,0.07,0.07)), lampG: shG(new THREE.SphereGeometry(0.2,8,6))
    };
    const deck = new THREE.Mesh(quadGeo(eL[0]-0.9, eR[0]+0.9, eL[1]-0.9, eR[1]+0.9, len), BR.deck);
    deck.position.y = -0.04; sg.add(deck);
    [-1,1].forEach(side=>{
      const gs = gaps.filter(q=>q.side===side).map(q=>[q.t0, q.t1]).sort((p,q)=>p[0]-q[0]);
      let runs = [[0, len]];
      gs.forEach(([g0, g1])=>{
        const nx = [];
        runs.forEach(([a, b])=>{
          if(g1 <= a || g0 >= b){ nx.push([a,b]); return; }
          if(g0 > a) nx.push([a, g0]);
          if(g1 < b) nx.push([g1, b]);
        });
        runs = nx;
      });
      const xAt = t => { const k = Math.min(1, Math.max(0, t/len)); return side < 0 ? eL[0] + (eL[1]-eL[0])*k - 0.65 : eR[0] + (eR[1]-eR[0])*k + 0.65; };
      runs.filter(r => r[1]-r[0] > 0.3).forEach(([a, b])=>{
        const dx = xAt(b) - xAt(a), dz = -(b-a), L = Math.hypot(dx, dz);
        [1.15, 0.55].forEach(y=>{
          const rl = new THREE.Mesh(new THREE.BoxGeometry(0.1,0.1,L), BR.rail);
          rl.position.set((xAt(a)+xAt(b))/2, y, -(a+b)/2);
          rl.rotation.y = Math.atan2(dx, dz);
          sg.add(rl);
        });
        for(let t=a+0.3; t<=b; t+=3){
          const p = new THREE.Mesh(BR.postG, BR.post); p.position.set(xAt(t), 0.6, -t); sg.add(p);
        }
      });
      for(let t=6; t<len-1; t+=16){                 // lampy
        if(gaps.some(q => q.side===side && t > q.t0-0.5 && t < q.t1+0.5)) continue;
        const x = xAt(t);
        const pl = new THREE.Mesh(BR.poleG, BR.pole); pl.position.set(x, 2.5, -t); sg.add(pl);
        const arm = new THREE.Mesh(BR.armG, BR.pole); arm.position.set(x - side*0.45, 5.0, -t); sg.add(arm);
        const lp = new THREE.Mesh(BR.lampG, BR.lamp); lp.position.set(x - side*0.85, 4.92, -t); sg.add(lp);
      }
    });
  }

  // Terén + scenérie jednoho kousku silnice. hA/hB = poloviční šířka silnice na začátku/konci.
  // tMin = od jaké vzdálenosti se smí stavět (u boční ulice se nechá volný roh křižovatky).
  function dressPiece(g, biome, len, eL, eR, dir, gaps, tMin){
    gaps = gaps || [];
    const sg = makeStrip(g, len, dir);
    addGround(sg, biome, len);
    if(biome === 'bridge'){ bridgeStrip(sg, len, eL, eR, gaps); return; }
    const make = biome==='forest' ? makeTree : (biome==='industry' ? makeIndustry : makeCityDecor);
    const edge = (side, t) => { const k = Math.min(1, Math.max(0, t/len)), e = side < 0 ? eL : eR; return e[0] + (e[1]-e[0])*k; };
    const rows = biome==='forest' ? [0, 5.5] : [0];
    rows.forEach(rowOff=>{
      [-1,1].forEach(side=>{
        let t = bRnd(0.3, 3) + (tMin || 0);
        while(t < len){
          const it = make(), tc = t + it.d/2;
          if(tc + it.d/2 > len - 0.3) break;     // nic nepřečuhuje přes konec kousku (do křižovatky souseda)
          const blocked = gaps.some(q => q.side===side && tc + it.d/2 > q.t0 && tc - it.d/2 < q.t1);
          if(!blocked){
            const ex = side < 0 ? Math.min(edge(-1, tc - it.d/2), edge(-1, tc + it.d/2))
                                : Math.max(edge(1,  tc - it.d/2), edge(1,  tc + it.d/2));
            it.obj.position.set(ex + side*(0.55 + it.lat + it.off + rowOff), it.y, -tc);
            sg.add(it.obj);
          }
          t += it.d + bRnd(it.gap[0], it.gap[1]);
        }
      });
    });
  }

  // Barva mlhy a oblohy plynule přechází do prostředí ~45 jednotek před hráčem.
  const _fogTarget = new THREE.Color();
  function setAtmosphere(biome){
    if(!scene || !scene.fog || !BIOMES[biome]) return;
    scene.background.set(BIOMES[biome].fog);
    scene.fog.color.set(BIOMES[biome].fog);
  }
  function updateAtmosphere(dt, instant){
    if(!scene || !scene.fog) return;
    let b = null;
    for(const p of roadPieces){
      if(p.rot || p.isStub || !p.biome) continue;
      const c = p.g.position.z;
      if(-45 <= c + p.hz && -45 >= c - p.hz){ b = p.biome; break; }
    }
    if(!b) return;
    _fogTarget.set(BIOMES[b].fog);
    const k = instant ? 1 : Math.min(dt*1.4, 1);
    scene.background.lerp(_fogTarget, k);
    scene.fog.color.lerp(_fogTarget, k);
  }

  function recalcScore(){ score = coinScore + bottleScore*5 + bonusScore; scoreEl.textContent = score; }
  function updateHud(){ coinsEl.textContent = coinScore; bottlesEl.textContent = bottleScore; scoreEl.textContent = score; }
  const bonusFlashEl = document.getElementById('bonusFlash');
  function showBonus(txt){
    if(!bonusFlashEl) return;
    bonusFlashEl.textContent = txt;
    bonusFlashEl.style.opacity = '1'; bonusFlashEl.style.transform = 'translate(-50%,-50%) scale(1)';
    clearTimeout(showBonus._t);
    showBonus._t = setTimeout(()=>{ bonusFlashEl.style.opacity = '0'; bonusFlashEl.style.transform = 'translate(-50%,-50%) scale(0.6)'; }, 2000);
  }

  function nearestLane(n, lo, x){
    let best = lo, bd = 1e9;
    for(let k=0;k<n;k++){
      const gl = lo + k, d = Math.abs(laneXOf(gl) - x);
      if(d < bd - 1e-6 || (Math.abs(d-bd) <= 1e-6 && gl > best)){ bd = d; best = gl; }
    }
    return best;
  }

  // Silnice pod hráčem (poloha a počet pruhů -> povolené pruhy) a kamera: sleduje střed
  // silnice (i když se přechodem posune na stranu) a u širších úseků se odsune.
  function updateRoadState(dt){
    let under = null, xmin = 1e9, xmax = -1e9;
    for(const p of roadPieces){
      if(p.rot || p.isStub) continue;
      const c = p.g.position.z, zN = c + p.hz, zF = c - p.hz;
      if(zN >= 0 && zF <= 0) under = p;
      if(zN >= -14 && zF <= 0){
        xmin = Math.min(xmin, p.xl0, p.xl1); xmax = Math.max(xmax, p.xr0, p.xr1);
      }
    }
    if(under && (under.n !== roadN || under.lo !== roadLo)){
      roadN = under.n; roadLo = under.lo;
      const hi = roadLo + roadN - 1;
      const ok = currentLane >= roadLo - 1e-6 && currentLane <= hi + 1e-6 && Math.abs((currentLane - roadLo) % 1) < 1e-6;
      if(!ok){ currentLane = nearestLane(roadN, roadLo, laneXOf(currentLane)); targetX = laneXOf(currentLane); }
    }
    let spanHalf;
    if(xmax > xmin){ camTargetX = (xmin + xmax)/2; spanHalf = (xmax - xmin)/2 - (LANE_W/2 + 0.35); }
    else { camTargetX = 0; spanHalf = (roadN - 1)*LANE_W/2; }
    const need = Math.max(1, (spanHalf + LANE_MARGIN) / (LANE_HALF_MAX + LANE_MARGIN));
    camZoom += (need - camZoom) * Math.min(dt*2.2, 1);
    camCX += (camTargetX - camCX) * Math.min(dt*2.2, 1);
  }

  // ODBOČKA: celý svět se tuhým pohybem otočí kolem hráče o 90° tak, aby boční
  // ulice mířila rovně před něj. Kamera se z "starého" pohledu plynule dotočí.
  function doTurn(piece, a){
    const dir = a.dir, theta = dir < 0 ? -Math.PI/2 : Math.PI/2;
    const sn = dir < 0 ? -1 : 1;                       // sin(theta); cos(theta) = 0
    const qx = laneXOf(a.lane), qz = piece.g.position.z + a.lz;
    const Y = new THREE.Vector3(0,1,0);
    const tf = v => { const x1 = v.x - qx, z1 = v.z - qz; return new THREE.Vector3(z1*sn, v.y, -x1*sn); };
    const mv = o => { o.position.copy(tf(o.position)); o.rotateOnWorldAxis(Y, theta); };

    const camFrom = tf(camera.position);
    const lookFrom = tf(new THREE.Vector3(0, GAME_LOOKAT.y + camElev, GAME_LOOKAT.z));
    const pp = tf(playerGroup.position);

    roadPieces.forEach(p=>{ mv(p.g); const t = p.hx; p.hx = p.hz; p.hz = t; p.rot = true; p.arrows = []; });
    obstacles.forEach(o=>{ mv(o.mesh); o.lane = -99; o.dead = true; });
    coins.forEach(o=>{ mv(o.mesh); o.lane = -99; o.dead = true; });
    bottles.forEach(o=>{ mv(o.mesh); o.lane = -99; o.dead = true; });

    // Boční ulice je teď silnice před hráčem.
    const st = a.stub;
    cutBiome = st.biome || 'city';   // v tomhle prostředí proběhne případná zastávka u policejního auta
    st.rot = false; st.isStub = false; st.cap.visible = false;
    spawnCursorZ = st.g.position.z - st.hz;
    clearSegLabel();   // po odbočce začíná nová trať
    roadN = st.n; lastRoadN = st.n; roadLo = laneLo(st.n); lastRoadLo = roadLo; camCX = 0; camTargetX = 0;
    currentLane = nearestLane(st.n, roadLo, 0); targetX = laneXOf(currentLane);
    playerGroup.position.x = pp.x;

    turnAnim = { t:0, theta, dir, camFrom, lookFrom };
    turnYaw = theta; playerGroup.rotation.y = theta;
    camera.position.copy(camFrom); camera.lookAt(lookFrom);
  }

  // Náraz zboku do policejního auta -> úvodní scéna (močení) se přehraje znovu. Močení trvá
  // PEE_SEC_PER_BOTTLE s na lahváč a body se připisují průběžně (viz introLoop). Lahváče se vynulují,
  // jejich vlastní body (5 za kus) zůstávají. Pak přiběhne policista a hra pokračuje.
  // (Sem později patří i další cut scény.)
  function startPeeCutscene(){
    const n = bottleScore;
    carsPeed++;
    bonusScore += n*5;
    bottleScore = 0;
    peePts = n*PEE_POINTS_PER_BOTTLE; peeGot = 0;
    autoAdvanceAt = Math.max(1.0, n*PEE_SEC_PER_BOTTLE);
    recalcScore(); updateHud();
    showBonus('POMOČENO!');
    running = false;
    // Žádný vzlet kamery: rovný střih rovnou do úvodní scény. Prostředí zůstává to, ve kterém se odbočilo.
    overlay.classList.add('hidden');
    cutKeep = true;
    reset(true);
    enterIntroScene(true);
  }

  function initThree(){
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f1220);
    scene.fog = new THREE.Fog(0x0f1220, 18, 85);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 200);
    camera.position.set(0,4.3,7.4);
    camera.lookAt(0,1.3,-12);

    renderer = new THREE.WebGLRenderer({canvas, antialias:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    resize();

    // Vylepšené nasvícení pro detailní auto i postavu
    scene.add(new THREE.HemisphereLight(0xddeeff,0x20252b,0.8));
    const key=new THREE.DirectionalLight(0xffffff,1.2);key.position.set(-5,8,6);scene.add(key);
    const rim=new THREE.DirectionalLight(0x397dff,0.6);rim.position.set(5,4,-6);scene.add(rim);

    // Silnice se skládá ze segmentových kousků (viz buildSegmentRoad). Na úvodní
    // obrazovce stojí jeden dlouhý tříproudý kus, ten se při startu hry přestaví.
    resetBiomes();
    buildSegmentRoad(3, 1, 22, -150, [], 'city');

    buildPlayer();
    applyPose(); // narovná postavu (viz komentář u applyPose) hned na startu, ne až v prvním loop()
    buildCop();
    copGroup.position.copy(COP_START_POS);
    // Natočení čelem ve směru běhu (od COP_START_POS k COP_END_POS).
    const copDir = new THREE.Vector3().subVectors(COP_END_POS, COP_START_POS);
    copGroup.rotation.y = Math.atan2(copDir.x, copDir.z);
    introActive = false;   // s menu se úvodní scéna staví až po kliknutí na HRÁT (viz playRestartSwoop)
  }

  // Konec proudu leží přímo na bočním panelu auta (dřív mířil dovnitř karoserie,
  // takže byl rozprsk schovaný uvnitř laku a nebyl vidět).
  const PEE_END = new THREE.Vector3(1.28, 0.5, -0.5);
  let introT0, introPrevT, stopping = false, stopT = 0;
  let autoAdvance = false, autoAdvanceAt = 1.7;
  let peePts = 0, peeGot = 0;   // body za močení: kolik se má připsat / kolik už je připsáno

  function peeTexture(){
    // Pruhovaná textura, kterou posouváme podél délky (map.offset.y) - tím
    // vzniká dojem tekoucí kapaliny, ne jen statické trubice/pásu.
    const c = document.createElement('canvas'); c.width=8; c.height=32;
    const cx = c.getContext('2d');
    cx.fillStyle = '#ffd83d'; cx.fillRect(0,0,8,32);
    cx.fillStyle = '#fff6b0'; cx.fillRect(0,0,8,12);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(1,5);
    return t;
  }
  function splashTexture(){
    const c = document.createElement('canvas'); c.width=64; c.height=64;
    const cx = c.getContext('2d');
    const g = cx.createRadialGradient(32,32,2,32,32,30);
    g.addColorStop(0,'rgba(255,245,180,.95)'); g.addColorStop(.55,'rgba(255,216,61,.55)'); g.addColorStop(1,'rgba(255,216,61,0)');
    cx.fillStyle = g; cx.fillRect(0,0,64,64);
    return new THREE.CanvasTexture(c);
  }
  function puddleTexture(){
    const c = document.createElement('canvas'); c.width=96; c.height=96;
    const cx = c.getContext('2d');
    const g = cx.createRadialGradient(48,48,4,48,48,46);
    g.addColorStop(0,'rgba(255,224,90,.85)'); g.addColorStop(.6,'rgba(214,184,50,.6)'); g.addColorStop(.85,'rgba(180,150,30,.35)'); g.addColorStop(1,'rgba(180,150,30,0)');
    cx.fillStyle = g; cx.fillRect(0,0,96,96);
    return new THREE.CanvasTexture(c);
  }

  function buildIntroScene(autoStartLoop){
    if(autoStartLoop===undefined) autoStartLoop = true;
    // Postavu na úvodní obrazovce natočíme čelem k autu (jinak stojí zády).
    playerGroup.rotation.y = -Math.PI/2;

    introCar = getPoliceCar();
    introCar.position.set(2.1, 0, -0.6);
    scene.add(introCar);

    const streamMat = new THREE.MeshBasicMaterial({map:peeTexture(), transparent:true, opacity:0.9});
    const curve = new THREE.QuadraticBezierCurve3(new THREE.Vector3(), new THREE.Vector3(), PEE_END);
    peeStream = new THREE.Mesh(new THREE.TubeGeometry(curve,20,0.02,8,false), streamMat);
    scene.add(peeStream);

    // Kruh dopadu na karoserii + pramínky, které po ní stékají.
    const splashMat = new THREE.MeshBasicMaterial({map:splashTexture(), transparent:true, depthWrite:false});
    splashCircle = new THREE.Mesh(new THREE.CircleGeometry(0.22,24), splashMat);
    splashCircle.position.set(PEE_END.x-0.015, PEE_END.y, PEE_END.z); splashCircle.rotation.y = -Math.PI/2;
    scene.add(splashCircle);
    drips = [];
    for(let i=0;i<3;i++){
      const h = 0.5+i*0.15;
      const g = new THREE.PlaneGeometry(0.05,h); g.translate(0,-h/2,0);
      const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({map:peeTexture(), transparent:true, opacity:0.6, depthWrite:false}));
      m.position.set(PEE_END.x-0.015, PEE_END.y-0.02, PEE_END.z+(i-1)*0.07); m.rotation.y = -Math.PI/2;
      scene.add(m); drips.push(m);
    }
    // Louže na zemi pod autem - pomalu roste, jak dlouho pramínky stékají.
    const puddleMat = new THREE.MeshBasicMaterial({map:puddleTexture(), transparent:true, depthWrite:false});
    puddle = new THREE.Mesh(new THREE.CircleGeometry(1,28), puddleMat);
    puddle.rotation.x = -Math.PI/2; puddle.position.set(PEE_END.x-0.05, 0.012, PEE_END.z);
    puddle.scale.set(0.001,0.001,1); scene.add(puddle);

    // Kamera pro úvodní scénu: bokorys na postavu i auto, místo herního pohledu zezadu.
    camera.position.copy(INTRO_CAM_POS);
    camera.lookAt(INTRO_LOOKAT);

    introT0 = undefined;
    if(autoStartLoop) requestAnimationFrame(introLoop);
  }

  // Klidový postoj místo zmrzlé běžecké fáze + rozhlížení kolem sebe.
  function applyIntroPose(time){
    const breathe = Math.sin(time*1.1)*0.015;
    legs.forEach(L => { L.hip.rotation.x=-0.08; L.knee.rotation.x=0.16; L.ankle.rotation.x=-0.08; });
    pelvis.position.set(0, 0.87+breathe*0.3, 0); pelvis.rotation.y = 0;
    torso.rotation.x = 0.12+breathe; torso.rotation.y = 0.04*Math.sin(time*0.5); torso.rotation.z = 0;
    headGrp.rotation.x = -0.1 + 0.14*Math.sin(time*0.85+0.4); // přikyvování nahoru/dolů
    const s = -Math.sin(time*0.55);
    headGrp.rotation.y = Math.sign(s)*Math.pow(Math.abs(s),0.5)*1.15; // rychlé otočení - nejdřív do kamery, pak na druhou stranu
    headGrp.rotation.z = 0.03*Math.sin(time*0.3+0.5);
    arms.forEach(A => {
      if(A.side===1){ A.sh.rotation.x=-1.25; A.sh.rotation.z=A.side*0.15; A.el.rotation.x=-1.55; }
      else { A.sh.rotation.x=-0.12+0.03*Math.sin(time*0.6); A.sh.rotation.z=A.side*0.08; A.el.rotation.x=-0.22; }
    });
    spikes.forEach(sp => { sp.rotation.x = sp.userData.base-0.1+0.06*Math.sin(time*3+sp.userData.i*0.7); });
  }

  function introLoop(t){
    if(!introActive) return;
    if(introT0===undefined){ introT0 = t; introPrevT = t; }
    const time = (t-introT0)/1000;
    const dt = Math.min((t-introPrevT)/1000, 0.05); introPrevT = t;

    applyIntroPose(time);

    // Body za močení na policejní auto: jeden bod za každých PEE_SEC_PER_BOTTLE / PEE_POINTS_PER_BOTTLE s.
    if(peePts > peeGot && !stopping){
      const due = Math.min(peePts, Math.floor(time/(PEE_SEC_PER_BOTTLE/PEE_POINTS_PER_BOTTLE)));
      while(peeGot < due){ peeGot++; bonusScore++; recalcScore(); showBonus('POMOČENO! +' + peeGot); }
    }

    // Po restartu se cajt spustí sám - punkáč chvíli počůrává auto a pak
    // (bez čekání na klik) přiběhne policista úplně stejně jako při první hře.
    if(autoAdvance && !stopping && time>=autoAdvanceAt){ beginStop(); }

    if(copActive){
      copT += dt;
      const ctt = Math.min(copT/COP_RUN_DURATION, 1);
      const cease = ctt<0.5 ? 2*ctt*ctt : 1-Math.pow(-2*ctt+2,2)/2; // easeInOutQuad
      copGroup.position.lerpVectors(COP_START_POS, COP_END_POS, cease);
      copPhase += dt*9;
      applyCopPose(copPhase);
      if(ctt>=1) copActive = false;
    }

    // Fáze 1 (0 - PEE_STOP_DUR): dočůrá. Fáze 2 (až poté): teprve se otáčí.
    const PEE_STOP_DUR = 0.4, TURN_DUR = 0.6;
    if(stopping){
      stopT += dt;
      const turnP = Math.max(0, Math.min((stopT-PEE_STOP_DUR)/TURN_DUR, 1));
      const ease = turnP<0.5 ? 2*turnP*turnP : 1-Math.pow(-2*turnP+2,2)/2;
      playerGroup.rotation.y = -Math.PI/2 + ease*(Math.PI/2); // plynulé otočení čelem k trati, až KDYŽ dočůral
    }

    // Proud teče normálně, dokud nedáme start; pak se plynule "utne" u těla.
    const flowFade = stopping ? Math.max(0, 1-stopT/PEE_STOP_DUR) : 1;
    peeStream.visible = flowFade>0;
    // Zvuk proudu - naplánujeme ho hned, jak existuje audioCtx, i když ještě
    // čeká na potvrzený stav "running" (resume() se vyřeší asynchronně).
    // Dřív se čekalo na state==='running', což se ale u úplně prvního
    // kliknutí na HRAT stihlo vyřešit až PO doběhnutí čůrání - proto zvuk
    // v úvodní scéně chyběl a objevil se až po restartu (audio už bylo hotové).
    if(audioCtx){
      if(!peeNoiseSource) startPeeSound();
      setPeeVolume(flowFade>0 ? 0.1*flowFade : 0);
    }
    if(flowFade>0){
      const startW = new THREE.Vector3(); peeAnchor.getWorldPosition(startW);
      const wob = Math.sin(time*7)*0.09;
      const ctrl = new THREE.Vector3().lerpVectors(startW, PEE_END, 0.45); ctrl.y += 0.55+wob; ctrl.z += wob*0.6;
      const curve = new THREE.QuadraticBezierCurve3(startW, ctrl, PEE_END);
      peeStream.geometry.dispose();
      peeStream.geometry = new THREE.TubeGeometry(curve,20,(0.02+Math.abs(wob)*0.015)*flowFade,8,false);
      peeStream.material.map.offset.y = -time*2.2;
      peeStream.material.opacity = 0.9*flowFade;
    }

    // Poslední kapky stečou do louže, pak i rozprsk a pramínky zmizí (souběžně s otáčením).
    const splashFade = stopping ? Math.max(0, 1-(stopT-PEE_STOP_DUR*0.5)/(PEE_STOP_DUR*0.5+TURN_DUR)) : 1;
    splashCircle.material.opacity = (0.55 + 0.25*Math.abs(Math.sin(time*3))) * splashFade;
    drips.forEach((d,i) => {
      d.scale.y = 0.8+0.2*Math.abs(Math.sin(time*0.9+i*1.3));
      d.material.map.offset.y = -time*(1.4+i*0.25);
      d.material.opacity = (0.45+0.3*Math.abs(Math.sin(time*2+i))) * splashFade;
    });
    const lastDrop = stopping ? Math.min(stopT/PEE_STOP_DUR,1)*0.05 : 0;
    const grow = Math.min(1, 1-Math.exp(-time/14) + lastDrop);
    const r = 0.18+0.62*grow;
    puddle.scale.set(r,r,1);
    puddle.material.opacity = 0.75+0.15*Math.abs(Math.sin(time*1.5));

    // Restart: kamera se při sestupu z výšky řídí tady, ať úvodní scéna běží (póza, proud, louže) už během letu.
    if(swoopPhase === 'down'){
      const tt2 = Math.min((t - swoopT0)/1000/SWOOP_DOWN_DUR, 1);
      const ease2 = 1 - Math.pow(1 - tt2, 3);
      camera.position.lerpVectors(SWOOP_PEAK_POS, INTRO_CAM_POS, ease2);
      camera.lookAt(new THREE.Vector3().lerpVectors(SWOOP_PEAK_LOOK, INTRO_LOOKAT, ease2));
      if(tt2 >= 1){ camera.position.copy(INTRO_CAM_POS); camera.lookAt(INTRO_LOOKAT); swoopPhase = null; }
    }
    renderer.render(scene, camera);

    if(stopping && stopT>=PEE_STOP_DUR+TURN_DUR){ finishStart(); return; }
    requestAnimationFrame(introLoop);
  }

  function beginStop(){
    if(stopping || !introActive) return;
    while(peeGot < peePts){ peeGot++; bonusScore++; }   // pro jistotu doplatit zbytek bodů
    if(peePts > 0){ recalcScore(); showBonus('POMOČENO! +' + peePts); }
    stopping = true; stopT = 0;
    overlay.classList.add('hidden');
    // Ve chvíli kliknutí na "HRAT" přiběhne do scény policista.
    copActive = true; copT = 0; copPhase = 0;
    copGroup.position.copy(COP_START_POS);
    copGroup.visible = true;
    playWhistleSound();
  }

  let running=false;
  let moveSpeed, dist, score, coinScore, bottleScore, spawnCursorZ, lastSegmentId;
  let totalBottles = 0, carsPeed = 0, crashText = '';   // statistiky pro obrazovku game over
  let bonusScore = 0;   // trvalé body: vyčerpané lahváče + pomočená policejní auta
  let currentLane, targetX, jumping, jumpT;
  let obstacles, coins, bottles;

  // --- "NAKLÁDAČKA": když punkáč skončí v louži nebo naboural auto, doběhne
  // ho policista a několikrát ho praští obuškem, teprve pak přijde GAME OVER.
  let busting = false, bustT = 0, bustType = null;
  const BUST_RUN_DUR = 0.55, BUST_HIT_DUR = 1.1, BUST_HOLD_DUR = 0.4;
  const BUST_TOTAL = BUST_RUN_DUR + BUST_HIT_DUR + BUST_HOLD_DUR;
  // Poslední fáze běhu (frozen pózy nohou), aby při přechodu do bití
  // nikdy neškublo pánví/nohama - kopírujeme si je z applyCopPose a dál
  // se jich v bití vůbec nedotýkáme.
  let bustCamBase, bustHitFired = false, camShake = 0;
  let bustObstacle = null, bustObstacleZ0 = 0, bustObstacleScale0 = null;
  const hitFlash = document.getElementById('hitFlash');
  let bustZ = 0; // z-ová pozice punkáče při nakládačce (po odrazu od auta)

  // --- SPLAT: při nárazu do auta se punkáč "rozplácne" přes kapotu / kufr.
  // Auto zůstane stát (svět se zastaví), punkáč se od něj krátce odrazí,
  // vyletí na plech, trup se mu překlopí přes hranu, ruce a nohy zůstanou
  // viset. Konstanty jdou snadno doladit:
  const SPLAT = {
    HIT_DUR: 0.12,        // s: odraz / přisunutí k hraně auta
    RISE_DUR: 0.18,       // s: vyhození nahoru na plech
    FOLD_DUR: 0.20,       // s: překlopení trupu přes hranu
    TORSO_LIE: 1.46,      // rad: úhel trupu na kapotě (1.57 = úplně vodorovně)
    TORSO_LIE_REAR: 1.52, // rad: úhel trupu na kufru
    ARM_WORLD: -1.72,     // rad: směr paží ve světě (-1.57 = rovně dopředu, víc = nahoru)
    CLEAR: 0.15,          // výška osy trupu nad plechem
    EDGE_GAP: 0.10        // odstup boků od hrany auta
  };
  const splat = { active: false };
  // --- SIT: náraz do vysokého vozidla (dodávka, kamion). Přes střechu se nedá přehodit, takže
  // se punkáč od plechu odrazí kousek dozadu, vyhodí ruce i nohy a sedne si na zadek.
  const SIT = { BOUNCE:1.0, AIR_DUR:0.38, SIT_Y:0.17, GAP:0.32 };
  const sit = { active:false };
  let bustCopOff = 4.4;
  // --- LIE: po uklouznutí na louži leží punkáč na zádech (póza z updateSlip zůstane) a přiběhne policista.
  const lie = { active:false };
  function applyLyingPose(t, jolt){
    playerGroup.rotation.x = Math.PI/2;
    torso.rotation.x = -0.12 + 0.18*jolt;
    headGrp.rotation.x = 0.18 + 0.2*jolt;
    legs.forEach((L,i)=>{ L.hip.rotation.x = -0.70 + 0.2*jolt*(i?1:-1); L.knee.rotation.x = 0.50 - 0.1*jolt; });
  }

  // --- SIDE: náraz do auta ZBOKU za běhu. Auto zůstane stát, punkáč se od něj odrazí do strany,
  // ve vzduchu se otočí o 180° (skončí čelem ke kameře) a dopadne na zadek. Pak přiběhne policista.
  const SIDE = { BOUNCE:0.9, AIR_DUR:0.44, SPIN_DUR:0.46, DRIFT:0.3 };   // BOUNCE = odraz do strany, DRIFT = jak daleko ještě "doklouže" dopředu
  const side = { active:false };
  function prepareSide(car){
    const p = playerGroup.position;
    let dir = Math.sign(p.x - car.position.x);              // odraz směrem od auta
    if(dir === 0) dir = car.position.x > 0 ? -1 : 1;
    side.dir = dir;
    side.x0 = p.x; side.y0 = p.y; side.z0 = p.z; side.zT = p.z - SIDE.DRIFT;
    side.pelvisY = pelvis.position.y;
    side.torso = { x: torso.rotation.x, y: torso.rotation.y, z: torso.rotation.z };
    side.head = { x: headGrp.rotation.x, y: headGrp.rotation.y, z: headGrp.rotation.z };
    side.legs = legs.map(L=>({ h: L.hip.rotation.x, k: L.knee.rotation.x, a: L.ankle.rotation.x }));
    side.arms = arms.map(A=>({ sx: A.sh.rotation.x, sz: A.sh.rotation.z, ex: A.el.rotation.x }));
    side.flashed = false;
    side.active = true;
  }
  function applySidePose(t, jolt){
    const q = side, lerp = THREE.MathUtils.lerp;
    const c01 = v=>Math.max(0, Math.min(1, v));
    const outCubic = p=>1-Math.pow(1-p,3);
    const smooth = p=>p*p*(3-2*p);
    const outBack = (p,c1)=>{ const c3=c1+1; return 1 + c3*Math.pow(p-1,3) + c1*Math.pow(p-1,2); };

    const fly   = c01(t/SIDE.AIR_DUR);                  // let vzduchem
    const slide = outCubic(c01(t/0.55));                // odraz do strany (zpomaluje)
    const spinE = smooth(c01(t/SIDE.SPIN_DUR));         // otočka o 180°
    const eLeg  = outCubic(c01((t-0.08)/0.32));
    const eArm  = outBack(c01(t/0.20), 1.2);
    const dropK = smooth(c01((t-0.32)/0.14));           // pád pánve na zem
    const propK = smooth(c01((t-0.42)/0.22));           // ruce se opřou za zády
    const calm  = c01((t-0.7)/0.3);
    const landed = t - SIDE.AIR_DUR;
    const bump = landed>0 ? 0.06*Math.exp(-landed*8)*Math.abs(Math.sin(landed*20)) : 0;

    playerGroup.position.x = q.x0 + q.dir*SIDE.BOUNCE*slide;
    playerGroup.position.z = lerp(q.z0, q.zT, slide);
    playerGroup.position.y = q.y0 + 0.40*Math.sin(Math.PI*fly) + bump;
    // Otočí se od auta (rameno, do kterého narazil, jde dozadu); při pádu se zakloní dozadu (už čelem ke kameře).
    const lean = 0.35*Math.sin(Math.PI*c01(t/0.22)) - 0.40*Math.sin(Math.PI*c01((t-0.30)/0.30));
    playerGroup.rotation.set(lean, -q.dir*Math.PI*spinE, 0);

    pelvis.position.y = lerp(q.pelvisY, SIT.SIT_Y, dropK);
    pelvis.rotation.y = 0;
    legs.forEach((L,i)=>{
      const l = q.legs[i], sd = L.side || (i?1:-1);
      L.hip.rotation.x = lerp(l.h, -1.45, eLeg) + 0.05*jolt;
      L.hip.rotation.z = sd*0.10*eLeg;
      L.knee.rotation.x = lerp(l.k, 0.30, eLeg);
      L.ankle.rotation.x = lerp(l.a, 0.15, eLeg);
    });
    const arch = lerp(q.torso.x, -0.3, c01(t/0.2));
    torso.rotation.x = lerp(arch, -0.10, smooth(calm)) + 0.22*jolt + 0.03*Math.sin(t*4)*calm;
    torso.rotation.y = lerp(q.torso.y, 0, eLeg);
    torso.rotation.z = lerp(q.torso.z, 0, eLeg);
    headGrp.rotation.x = lerp(q.head.x, -0.12, calm) + 0.2*jolt;
    headGrp.rotation.y = lerp(q.head.y, 0.55*Math.sin(t*2.4), calm);
    headGrp.rotation.z = lerp(q.head.z, 0.22*Math.sin(t*3.1+1), calm);
    arms.forEach((A,i)=>{
      const a = q.arms[i];
      const upX = lerp(a.sx, -2.6, eArm);
      A.sh.rotation.x = lerp(upX, 0.5, propK);
      A.sh.rotation.z = lerp(lerp(a.sz, A.side*0.7, eArm), A.side*0.32, propK);
      A.el.rotation.x = lerp(lerp(a.ex, -0.3, eArm), -0.08, propK);
    });
    if(!q.flashed && t>0.03){ q.flashed = true; flashHit(); }
  }

  function prepareSit(zEnd){
    const p = playerGroup.position;
    sit.x0 = p.x; sit.y0 = p.y; sit.z0 = p.z;
    sit.zC = Math.max(p.z, zEnd + SIT.GAP);        // místo dotyku s plechem
    sit.zT = sit.zC + SIT.BOUNCE;                  // kam dosedne
    sit.pelvisY = pelvis.position.y;
    sit.torso = { x: torso.rotation.x, y: torso.rotation.y, z: torso.rotation.z };
    sit.head = { x: headGrp.rotation.x, y: headGrp.rotation.y, z: headGrp.rotation.z };
    sit.legs = legs.map(L=>({ h: L.hip.rotation.x, k: L.knee.rotation.x, a: L.ankle.rotation.x }));
    sit.arms = arms.map(A=>({ sx: A.sh.rotation.x, sz: A.sh.rotation.z, ex: A.el.rotation.x }));
    sit.flashed = false;
    sit.active = true;
  }

  function applySitPose(t, jolt){
    const q = sit, lerp = THREE.MathUtils.lerp;
    const c01 = v=>Math.max(0, Math.min(1, v));
    const outCubic = p=>1-Math.pow(1-p,3);
    const smooth = p=>p*p*(3-2*p);
    const outBack = (p,c1)=>{ const c3=c1+1; return 1 + c3*Math.pow(p-1,3) + c1*Math.pow(p-1,2); };

    const eHit  = c01(t/0.06);                         // přisunutí ke stěně
    const flight = c01((t-0.04)/SIT.AIR_DUR);          // vzduch po odrazu
    const eBack = outCubic(c01((t-0.04)/0.52));        // odraz dozadu (zpomaluje)
    const eLeg  = outCubic(c01(t/0.30));
    const eArm  = outBack(c01(t/0.20), 1.2);
    const dropK = smooth(c01((t-0.26)/0.16));          // pád pánve na zem
    const propK = smooth(c01((t-0.34)/0.22));          // ruce se opřou za zády
    const calm  = c01((t-0.5)/0.3);

    // Poloha: nejdřív ke stěně, pak odraz dozadu s obloučkem, nakonec drobné poskočení na zadku.
    const landed = t - (0.04 + SIT.AIR_DUR);
    const bump = landed>0 ? 0.05*Math.exp(-landed*9)*Math.abs(Math.sin(landed*22)) : 0;
    playerGroup.position.x = q.x0;
    playerGroup.position.z = lerp(q.z0, q.zC, eHit) + (q.zT - q.zC)*eBack;
    playerGroup.position.y = q.y0 + 0.45*Math.sin(Math.PI*flight) + bump;
    playerGroup.rotation.set(0,0,0);
    playerGroup.rotation.x = 0.5*Math.sin(Math.PI*c01((t-0.02)/0.42));   // ve vzduchu se zakloní

    // Pánev spadne k zemi, nohy letí dopředu a zůstanou natažené.
    pelvis.position.y = lerp(q.pelvisY, SIT.SIT_Y, dropK);
    pelvis.rotation.y = lerp(0, 0, 1);
    legs.forEach((L,i)=>{
      const l = q.legs[i], side = L.side || (i?1:-1);
      L.hip.rotation.x = lerp(l.h, -1.45, eLeg) + 0.05*jolt;
      L.hip.rotation.z = side*0.10*eLeg;
      L.knee.rotation.x = lerp(l.k, 0.30, eLeg);
      L.ankle.rotation.x = lerp(l.a, 0.15, eLeg);
    });

    // Trup: prohnutý do záklonu, pak se ustálí v mírném záklonu; rána obuškem ho předkloní.
    const arch = lerp(q.torso.x, -0.3, c01(t/0.18));
    torso.rotation.x = lerp(arch, -0.10, smooth(calm)) + 0.22*jolt + 0.03*Math.sin(t*4)*calm;
    torso.rotation.y = lerp(q.torso.y, 0, eLeg);
    torso.rotation.z = lerp(q.torso.z, 0, eLeg);

    // Hlava: omráčené kývání.
    headGrp.rotation.x = lerp(q.head.x, -0.12, calm) + 0.2*jolt;
    headGrp.rotation.y = lerp(q.head.y, 0.55*Math.sin(t*2.4), calm);
    headGrp.rotation.z = lerp(q.head.z, 0.22*Math.sin(t*3.1+1), calm);

    // Ruce: vyhozené nahoru při nárazu, pak opřené o zem za zády.
    arms.forEach((A,i)=>{
      const a = q.arms[i];
      const upX = lerp(a.sx, -2.6, eArm);
      A.sh.rotation.x = lerp(upX, 0.5, propK);
      A.sh.rotation.z = lerp(lerp(a.sz, A.side*0.7, eArm), A.side*0.32, propK);
      A.el.rotation.x = lerp(lerp(a.ex, -0.3, eArm), -0.08, propK);
    });

    if(!q.flashed && t>0.05){ q.flashed = true; flashHit(); }
  }

  function prepareSplat(car){
    if(bustBaseY > 0.15) return;                    // hráč stál na střeše -> žádné přehození přes auto
    car.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(car);
    const carX = car.position.x;
    const zEnd = box.max.z; // konec auta, který je nejblíž punkáčovi
    // Předek (kapota) auta míří k hráči, když sin(rotation.y) > 0 (viz createPoliceCarTemplate).
    const frontToPlayer = Math.sin(car.rotation.y) > 0;
    // Výška plechu (kapota/kufr) těsně za hranou - zjistíme paprskem shora.
    const mid = (car.userData && car.userData.modelId) || '';
    // Pád na zadek: jeep a dodávka z obou stran, combi jen zezadu (zepředu se přehodí přes kapotu).
    if(/^(van|truck|jeep)_/.test(mid) || (/^combi_/.test(mid) && !frontToPlayer)){ prepareSit(zEnd); return; }
    const forceSplat = /^combi_/.test(mid) && frontToPlayer;
    let top = frontToPlayer ? 0.80 : 0.90;
    try{
      const rc = new THREE.Raycaster(new THREE.Vector3(carX, 4, zEnd-0.3), new THREE.Vector3(0,-1,0), 0, 8);
      const hit = rc.intersectObject(car, true)[0];
      if(hit && hit.point.y > 1.35 && !forceSplat){ prepareSit(zEnd); return; }   // vysoké vozidlo (dodávka, kamion): odraz a sednutí na zadek
      if(hit) top = THREE.MathUtils.clamp(hit.point.y, 0.55, 1.15);
    }catch(e){}

    const p = playerGroup.position;
    splat.x0 = p.x; splat.y0 = p.y; splat.z0 = p.z;
    splat.xT = THREE.MathUtils.clamp(p.x, carX-0.35, carX+0.35); // ať leží na plechu, ne vedle
    splat.zT = zEnd + SPLAT.EDGE_GAP;
    const pivot = (pelvis.position.y + torso.position.y) * root.scale.y; // výška osy trupu nad zemí
    splat.yT = top + SPLAT.CLEAR - pivot;
    splat.lie = frontToPlayer ? SPLAT.TORSO_LIE : SPLAT.TORSO_LIE_REAR;
    splat.torso = { x: torso.rotation.x, y: torso.rotation.y, z: torso.rotation.z };
    splat.head = { x: headGrp.rotation.x, y: headGrp.rotation.y, z: headGrp.rotation.z };
    splat.pelvisY = pelvis.rotation.y;
    splat.legs = legs.map(L=>({ h: L.hip.rotation.x, k: L.knee.rotation.x, a: L.ankle.rotation.x }));
    splat.arms = arms.map(A=>({ sx: A.sh.rotation.x, sz: A.sh.rotation.z, ex: A.el.rotation.x }));
    splat.flashed = false;
    splat.active = true;
  }

  function applySplatPose(t, jolt){
    const s = splat, lerp = THREE.MathUtils.lerp;
    const c01 = v=>Math.max(0, Math.min(1, v));
    const outCubic = p=>1-Math.pow(1-p,3);
    const outBack = (p,c1)=>{ const c3=c1+1; return 1 + c3*Math.pow(p-1,3) + c1*Math.pow(p-1,2); };

    const eHit  = outCubic(c01(t/SPLAT.HIT_DUR));
    const rise  = c01(t/SPLAT.RISE_DUR);
    const eFold = outBack(c01((t-0.03)/SPLAT.FOLD_DUR), 1.0);
    const eArm  = outBack(c01((t-0.05)/0.25), 1.4);
    const eLeg  = outCubic(c01(t/0.25));
    const slump = c01((t-0.3)/1.2);
    const decay = Math.exp(-t*4);

    // Odraz od auta + vyhození nahoru (s malým "hopem"), pak pomalé sesunutí.
    playerGroup.position.x = lerp(s.x0, s.xT, eHit);
    playerGroup.position.z = lerp(s.z0, s.zT, eHit);
    playerGroup.position.y = lerp(s.y0, s.yT, outCubic(rise)) + 0.12*Math.sin(rise*Math.PI) - 0.03*slump - 0.04*jolt;
    playerGroup.rotation.set(0,0,0);

    // Trup se překlopí dopředu přes hranu a ustálí na plechu.
    torso.rotation.x = lerp(s.torso.x, s.lie, eFold) + 0.06*jolt;
    torso.rotation.y = lerp(s.torso.y, 0, eHit);
    torso.rotation.z = lerp(s.torso.z, 0.05, eHit);
    pelvis.rotation.y = lerp(s.pelvisY, 0, eHit);

    // Hlava otočená bokem, tvář přimáčknutá k plechu.
    headGrp.rotation.x = lerp(s.head.x, -0.4, eFold);
    headGrp.rotation.y = lerp(s.head.y, 0.85, eFold);
    headGrp.rotation.z = lerp(s.head.z, 0, eFold);

    // Ruce rozhozené dopředu do "véčka" přes kapotu (úhel počítaný vůči světu).
    arms.forEach((A,i)=>{
      const a = s.arms[i], wave = decay*Math.sin(t*14+i*2.2)*0.18;
      A.sh.rotation.x = lerp(a.sx, SPLAT.ARM_WORLD - s.lie, eArm) + wave;
      A.sh.rotation.z = lerp(a.sz, A.side*0.65, eArm);
      A.el.rotation.x = lerp(a.ex, -0.15, eArm);
    });

    // Nohy zůstanou viset za hranou auta a doznívá jim kmitání.
    legs.forEach((L,i)=>{
      const l = s.legs[i], sw = decay*Math.sin(t*15+i*1.5);
      L.hip.rotation.x = lerp(l.h, 0.35, eLeg) + 0.35*sw + 0.3*jolt;
      L.knee.rotation.x = lerp(l.k, 0.55, eLeg) + 0.25*decay*Math.sin(t*15+i*1.5+1.2);
      L.ankle.rotation.x = lerp(l.a, 0.3, eLeg);
    });

    // PRÁSK! hned při nárazu.
    if(!s.flashed && t>0.04){ s.flashed = true; flashHit(); }
  }

  function flashHit(){
    camShake = 0.09;
    hitFlash.textContent = ['PRÁSK!','BUM!','AU!'][Math.floor(Math.random()*3)];
    hitFlash.style.opacity = '1';
    hitFlash.style.transform = 'translate(-50%,-50%) scale(1)';
    setTimeout(()=>{ hitFlash.style.opacity='0'; hitFlash.style.transform='translate(-50%,-50%) scale(0.6)'; }, 220);
  }

  function crashReasonText(type, mesh){
    if(type === 'puddle') return 'Uklouzl jsi po louži.';
    const id = (mesh && mesh.userData && mesh.userData.modelId) || '';
    const names = { sedan_police:'policejního auta', combi_police:'policejního auta', van_police:'policejní dodávky', truck_police:'policejního kamionu',
      sedan_civil:'auta', combi_civil:'auta', van_civil:'dodávky', truck_civil:'kamionu', ramp_civil:'kamionu', jeep_civil:'džípu', sport_civil:'sporťáku' };
    return 'Narazil jsi do ' + (names[id] || 'auta') + '.';
  }
  function startBust(type, hitMesh, sideHit){
    if(busting) return;
    crashText = crashReasonText(type, hitMesh);
    busting = true; bustT = 0; bustType = type;
    chaseActive = false;
    copPhase = 0;
    // Překážku, do které punkáč narazil, rychle "odmeteme" pryč po silnici
    // (zmenší se a odjede dál), místo aby zmizela naráz nebo zůstala trčet na místě.
    bustObstacle = hitMesh || null;
    if(bustObstacle){
      bustObstacleZ0 = bustObstacle.position.z;
      bustObstacleScale0 = bustObstacle.scale.clone();
    }
    copGroup.visible = true;
    copGroup.rotation.y = Math.PI;
    playWhistleSound();
    // Policista doběhne z většího odstupu a zastaví se vedle/za punkáčem,
    // ne přímo v jedné ose s ním (aby se modely nepřekrývaly a bylo vidět obušek).
    splat.active = false; sit.active = false; side.active = false; lie.active = (type==='puddle');
    if(type==='puddle') bustBaseY = playerGroup.position.y;
    if(type==='car' && bustObstacle){ if(sideHit) prepareSide(bustObstacle); else prepareSplat(bustObstacle); }
    bustZ = side.active ? side.zT : splat.active ? splat.zT : (sit.active ? sit.zT : lie.active ? playerGroup.position.z + 0.65 : playerGroup.position.z);   // lie: střed těla ležícího na zádech
    bustCopOff = (sit.active || side.active || lie.active) ? 3.6 : 4.4;     // policista nesmí začít za kamerou
    playerGroup.position.y = bustBaseY;
    // Kam policista doběhne: těsně k punkáčovi (odstup středů ~1 jednotka), aby na něj obuškem opravdu dosáhl.
    // dx / dz = posun policisty oproti punkáčovi (dz > 0 = blíž ke kameře). Podle pózy se mírně liší.
    bustX = side.active ? side.x0 + side.dir*SIDE.BOUNCE : splat.active ? splat.xT : sit.active ? sit.x0 : playerGroup.position.x;
    bustCopDX = -0.3; bustCopDZ = 0.95;                          // stojí / leží přes auto
    if(sit.active){ bustCopDZ = 0.85; }                          // sedí zády k policistovi
    if(side.active){ bustCopDX = side.dir*0.85; bustCopDZ = 0.35; }
    if(lie.active){ bustCopDX = -0.7; bustCopDZ = 0; }               // leží na zádech: policista stojí vedle něj a mlátí dolů   // sedí čelem ke kameře: policista stojí vedle něj (na straně od auta)
    copGroup.position.set(bustX + bustCopDX, bustBaseY, bustZ + bustCopOff);
    bustCamBase = camera.position.clone();
    hitFlash.style.opacity = '0';
  }

  let bustX = 0, bustCopDX = -0.3, bustCopDZ = 0.95;   // viz startBust: kde se policista zastaví vůči punkáčovi

  function updateBust(dt){
    bustT += dt;
    let jolt = 0; // otřes těla při ráně obuškem (pro splat pózu)
    const draped = splat.active, sitting = sit.active, sideFall = side.active, lying = lie.active, held = draped || sitting || sideFall || lying; // visí přes auto / sedí na zemi

    // Punkáč se nikdy úplně nezastaví - jemné vrávorání (když nevisí přes auto).
    playerGroup.rotation.z = held ? 0 : Math.sin(bustT*8)*0.035;

    // Odklizení překážky - jen když nejde o splat. Auto, přes které je punkáč
    // přehozený, zůstává stát na místě.
    if(bustObstacle && !held){
      const ck = Math.min(bustT/0.35, 1);
      bustObstacle.position.z = bustObstacleZ0 + ck*10;
      const f = Math.max(0.001, 1-ck);
      bustObstacle.scale.set(bustObstacleScale0.x*f, bustObstacleScale0.y*f, bustObstacleScale0.z*f);
      if(ck>=1){ scene.remove(bustObstacle); bustObstacle = null; }
    }

    if(bustT <= BUST_RUN_DUR){
      // Fáze 1: policista přibíhá zezadu k punkáčovi.
      const tt = Math.min(bustT/BUST_RUN_DUR, 1);
      const ease = tt<0.5 ? 2*tt*tt : 1-Math.pow(-2*tt+2,2)/2;
      copGroup.position.x = bustX + bustCopDX;
      copGroup.position.z = THREE.MathUtils.lerp(bustZ + bustCopOff, bustZ + bustCopDZ, ease);
      copPhase += dt*22;
      applyCopPose(copPhase);
      if(!held){
        torso.rotation.x = 0.35;
        headGrp.rotation.y = -0.4 * ease; // ohlédnutí dozadu
        arms.forEach(A=>{ A.sh.rotation.x = -1.1; A.el.rotation.x = -0.5; });
        if(bustType==='car'){
          const k = Math.min(bustT/0.22, 1);
          playerGroup.rotation.x = Math.sin(k*Math.PI)*0.12;
        }
      }
    } else if(bustT <= BUST_RUN_DUR + BUST_HIT_DUR){
      // Fáze 2: policista mlátí punkáče obuškem - nohy/pánev policisty se tu
      // vůbec nemění (zůstávají v poslední běžecké póze), hýbe se jen horní
      // polovina těla, takže nemůže "propadnout do země".
      const ht = bustT - BUST_RUN_DUR;
      copGroup.position.x = bustX + bustCopDX;
      copGroup.position.z = bustZ + bustCopDZ;
      const swings = 2;
      const cyc = (ht/BUST_HIT_DUR)*swings;
      const local = cyc % 1;
      const raise = local<0.45 ? local/0.45 : 1-((local-0.45)/0.55);
      const s = Math.max(0, raise);
      copTorso.rotation.x = 0.18 + 0.32*s + (lie.active ? 0.25 : 0);   // k ležícímu se předkloní víc
      copTorso.rotation.y = 0.18;
      copHeadGrp.rotation.x = -0.1; copHeadGrp.rotation.y = 0.15;
      // Obušek: mírný, čitelný rozsah (podobný rozsahu, který se běžně
      // používá i pro běžeckou animaci ruky) - ne extrémní zalomení.
      copArms[1].sh.rotation.x = -(0.3 + 1.0*s);
      copArms[1].sh.rotation.z = 0.3;
      copArms[1].el.rotation.x = -(0.9 + 0.4*s);
      copArms[0].sh.rotation.x = -0.5;
      copArms[0].el.rotation.x = -0.8;

      const impact = Math.max(0, 1-Math.abs(local-0.47)/0.09);
      if(held){
        jolt = impact; // tělo na autě / na zemi sebou při ráně škubne
      } else {
        torso.rotation.x = 0.4 + 0.25*impact;
        headGrp.rotation.x = -0.1 + 0.25*impact;
        playerGroup.position.y = bustBaseY - 0.05*impact;
        arms.forEach(A=>{ A.sh.rotation.x = -1.3 - 0.2*impact; A.el.rotation.x = -0.7; });
      }

      if(impact>0.9 && bustCamBase && !bustHitFired){
        bustHitFired = true;
        flashHit();
      }
      if(impact<0.3) bustHitFired = false;

    } else {
      // Fáze 3: krátká pauza na výsledné póze, než naskočí GAME OVER.
      copTorso.rotation.x = 0.15; copTorso.rotation.y = 0.1;
      copArms[1].sh.rotation.x = -0.5; copArms[1].el.rotation.x = -0.9;
      if(!held){
        torso.rotation.x = 0.6; headGrp.rotation.x = 0.1;
        playerGroup.position.y = bustBaseY - 0.06;
      }
    }

    // Policista je celou dobu čelem k punkáčovi (při doběhu míří dopředu, u něj se natočí přímo na něj).
    copGroup.rotation.y = Math.atan2(bustX - copGroup.position.x, bustZ - copGroup.position.z);

    if(draped) applySplatPose(bustT, jolt);
    else if(sitting) applySitPose(bustT, jolt);
    else if(sideFall) applySidePose(bustT, jolt);
    else if(lying) applyLyingPose(bustT, jolt);

    // Jemné zatřesení kamerou při zásahu.
    if(bustCamBase){
      camera.position.copy(bustCamBase);
      const shaking = (bustT>BUST_RUN_DUR && bustT<BUST_RUN_DUR+BUST_HIT_DUR) || (held && bustT<0.4);
      if(shaking){
        camera.position.x += (Math.random()-0.5)*camShake;
        camera.position.y += (Math.random()-0.5)*camShake;
      }
      camShake = Math.max(0, camShake-dt*2);
    }

    renderer.render(scene, camera);

    if(bustT >= BUST_TOTAL){
      busting = false;
      hitFlash.style.opacity = '0';
      // Při splatu necháme punkáče viset přes auto i za obrazovkou GAME OVER;
      // pózy se srovnají až při restartu.
      if(!held){
        playerGroup.rotation.set(0,0,0);
        playerGroup.position.y = bustBaseY;
        torso.rotation.x = 0.2; headGrp.rotation.x = -0.17;
        arms.forEach(A=>{ A.sh.rotation.x = 0; A.el.rotation.x = 0; });
      }
      endGame();
    }
  }

  // --- ULOUZNUTÍ NA LOUŽI: punkáč mu podjedou nohy, zamává rukama a spadne
  // naplocho na záda. Otáčíme celou postavu kolem chodidel (ta zůstávají na
  // místě), takže tělo dopadne přesně na zem bez ručního dopočítávání výšky.
  let slipping = false, slipT = 0;
  const SLIP_FALL_DUR = 0.3, SLIP_HOLD_DUR = 0.6;   // pád a ležení po uklouznutí (s)
  const SLIP_TOTAL = SLIP_FALL_DUR + SLIP_HOLD_DUR;
  // Svět při uklouznutí rychle zpomalí a zastaví se, takže hráč doklouže jen kousek za louži
  // (SLIP_SLIDE_DIST = přibližná vzdálenost v jednotkách světa). Louže se po něm "rozmaže" (smear).
  const SLIP_LIE_PAUSE = 0.2;   // jak dlouho po dopadu leží, než přiběhne policista
  const SLIP_SLIDE_DIST = 2.5, SLIP_SMEAR_HALF_W = 0.28;   // SLIP_SMEAR_HALF_W = polovina šířky šmouhy
  let slipV0 = 0, slipSlideDur = 0.6, slipPuddle = null, slipSmear = null;
  function removeSmear(){ if(slipSmear){ scene.remove(slipSmear.g); slipSmear.g.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material) o.material.dispose(); }); slipSmear = null; } }

  function startSlip(pud){
    if(slipping) return;
    slipping = true; slipT = 0;
    slipV0 = Math.max(moveSpeed, 1);
    slipSlideDur = Math.max(0.25, Math.min(0.8, 3*SLIP_SLIDE_DIST/slipV0));   // s kvadratickým brzděním = dráha ≈ v0*dur/3
    slipPuddle = pud || null;
    removeSmear();
    if(slipPuddle){
      // Rozmazaná šmouha ve barvě louže: plocha, která se při klouzání natahuje od louže k hráči.
      let col = new THREE.Color(0xb49a22);
      try{ col = slipPuddle.mesh.children[0].material.color.clone(); }catch(e){}
      const g = new THREE.Group();
      const m = new THREE.Mesh(new THREE.CircleGeometry(1, 28),
