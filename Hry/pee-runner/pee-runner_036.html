        new THREE.MeshPhongMaterial({color:col, specular:0xffffff, shininess:90, transparent:true, opacity:0.0, depthWrite:false}));
      m.rotation.x = -Math.PI/2; g.add(m);
      g.position.set(slipPuddle.mesh.position.x, 0.03, slipPuddle.mesh.position.z);
      scene.add(g);
      slipSmear = { g, m };
    }
    chaseActive = false;
    bustType = 'puddle'; // pro hlášku v endGame()
  }

  function updateSlip(dt){
    slipT += dt;
    if(slipSmear && slipPuddle){
      const pz = slipPuddle.mesh.position.z, start = -0.3, end = pz + 0.45;
      const half = Math.max(0.75, (end - start)/2);
      slipSmear.g.position.z = (start + end)/2;
      slipSmear.g.position.x = slipPuddle.mesh.position.x;
      slipSmear.m.scale.set(SLIP_SMEAR_HALF_W, half, 1);                   // x = polovina šířky, y (po otočení) = polovina délky
      slipSmear.m.material.opacity = Math.min(0.85, slipT/0.15*0.85);
    }
    const tt = Math.min(slipT/SLIP_FALL_DUR, 1);
    const ease = tt*tt; // zrychlující pád, jako gravitace

    // Celé tělo se překlápí dozadu kolem chodidel - dopadne přesně na zem.
    playerGroup.rotation.x = ease*(Math.PI/2);

    // Nohy vylétnou dopředu, jako by mu ujely (mírněji než dřív).
    legs.forEach((L,i)=>{
      L.hip.rotation.x = -0.25 - ease*0.65 + (i===0?0.1:-0.06);
      L.knee.rotation.x = 0.2 + ease*0.55;
      L.ankle.rotation.x = -0.15*ease;
    });
    // Ruce zamávají ve vzduchu, jak se snaží udržet rovnováhu.
    arms.forEach((A,i)=>{
      A.sh.rotation.x = -0.6 - ease*0.5 + Math.sin(slipT*20+i*3)*0.18*ease;
      A.sh.rotation.z = A.side*(0.2+0.2*ease);
      A.el.rotation.x = -0.4 - ease*0.45;
    });
    torso.rotation.x = -0.12*ease;
    headGrp.rotation.x = 0.18*ease;
    headGrp.rotation.y = Math.sin(slipT*10)*0.15*ease;

    if(tt>=1){
      // Leží na zádech - nohy se krátce po dopadu trochu uvolní.
      const ht = Math.min((slipT-SLIP_FALL_DUR)/0.3, 1);
      legs.forEach(L=>{ L.knee.rotation.x = 0.75 - ht*0.25; L.hip.rotation.x = -0.9 + ht*0.2; });
      arms.forEach(A=>{ A.sh.rotation.x = -1.0 + ht*0.25; });
    }

    if(slipT >= SLIP_FALL_DUR + SLIP_LIE_PAUSE){
      slipping = false;
      return 'bust'; // signál pro loop(): hráč leží na zádech -> přiběhne policista (startBust('puddle')) a až po bití naskočí GAME OVER
    }
    return false;
  }

  function reset(keep){
    moveSpeed = 30;
    dist = 0;
    if(!keep){ score = 0; coinScore = 0; bottleScore = 0; bonusScore = 0; totalBottles = 0; carsPeed = 0; }   // keep = po zastávce u policejního auta zůstává skóre
    spawnCursorZ = -40; lastSegmentId = null; phase = 0; T = 0;
    currentLane = 2; targetX = 0; jumping=false; jumpT=0;
    obstacles.forEach(o=>scene.remove(o.mesh));
    coins.forEach(c=>scene.remove(c.mesh));
    bottles.forEach(b=>scene.remove(b.mesh));
    obstacles = []; coins = []; bottles = [];
    roadPieces.forEach(p=>{ scene.remove(p.g); disposePiece(p); }); roadPieces = [];
    // Nová hra / restart = vždy město. Zastávka u policejního auta (keep) = prostředí, kde se odbočilo.
    const startBiome = keep ? cutBiome : 'city';
    if(keep){ bioCur = startBiome; bioLeft = bRndInt(BIOMES[startBiome].min, BIOMES[startBiome].max); }
    else resetBiomes();
    roadN = 3; lastRoadN = 3; roadLo = 1; lastRoadLo = 1; camZoom = 1; camCX = 0; camTargetX = 0;
    holdSpawn = false; parkedCar = null; turnAnim = null; turnYaw = 0;
    clearSegLabel();
    buildSegmentRoad(3, 1, 22, spawnCursorZ, [], startBiome);   // úvodní tříproudý úsek pod nohama
    setAtmosphere(startBiome);
    ensureSegmentsAhead(); // rovnou naplní první kus trati segmenty
    playerGroup.position.set(0,0,0);
    // Honička policistou se resetuje - první objevení přijde po náhodné pauze.
    chaseActive = false; chaseT = 0; chaseTimer = 6 + Math.random()*6;
    if(testSeg) chaseTimer = 1e9;                // v testu z editoru bez policisty
    busting = false; bustT = 0; bustHitFired = false; camShake = 0;
    splat.active = false; sit.active = false; side.active = false; lie.active = false; bustZ = 0;
    legs.forEach(L=>{ L.hip.rotation.z = 0; });   // po sednutí zpět do normálního rozkroku
    slipping = false; slipT = 0; slipPuddle = null; removeSmear();
    resetPlayerVertical();
    if(bustObstacle){ scene.remove(bustObstacle); bustObstacle = null; }
    hitFlash.style.opacity = '0';
    playerGroup.rotation.set(0,0,0);
    if(copGroup){ copGroup.visible = false; copGroup.position.y = 0; }
  }

  // --- ZVUK: cinknutí mince (Web Audio API, žádné externí soubory) ---
  // Prohlížeče povolí zvuk až po "platném" gestu uživatele - a mousedown/
  // touchstart mezi ně (na rozdíl od click/touchend/keydown) spolehlivě
  // NEPATŘÍ. Proto se úplně první pokus o resume() na mousedown/touchstart
  // často tiše nezdaří; teprve navazující click/touchend ho podrží. Proto je
  // unlockAudio() navěšený na víc událostí a navíc volaný i přímo z
  // requestStart(), aby se odemčení jistě stihlo v gestu, které se počítá.
  let audioCtx = null;
  function unlockAudio(){
    try{
      if(!audioCtx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return;
        audioCtx = new AC();
      }
      if(audioCtx.state === 'suspended') audioCtx.resume();
    }catch(e){}
  }
  ['touchstart','touchend','mousedown','click','keydown'].forEach(ev=>{
    window.addEventListener(ev, unlockAudio, {passive:true});
  });

  // Cinknutí = dva rychlé vysoké tóny za sebou (jako klasická herní mince).
  // Výšku tónů (baseFreq) lze měnit; náhodná odchylka ±3 % dělá zvuk živější.
  function playCoinSound(){
    if(!audioCtx || audioCtx.state !== 'running') return;
    const now = audioCtx.currentTime;
    const baseFreq = 1318 * (0.97 + Math.random()*0.06); // ~E6
    [[baseFreq, 0], [baseFreq*1.5, 0.07]].forEach(([freq, delay])=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now + delay);
      gain.gain.setValueAtTime(0.0001, now + delay);
      gain.gain.exponentialRampToValueAtTime(0.22, now + delay + 0.008); // rychlý nástup
      gain.gain.exponentialRampToValueAtTime(0.0001, now + delay + 0.28); // doznění
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now + delay);
      osc.stop(now + delay + 0.3);
    });
  }

  // Otevření lahváče: kovové cvaknutí / pop kapsle + syčení unikajícího plynu.
  let noiseBuf = null;
  function playBottleSound(){
    if(!audioCtx || audioCtx.state !== 'running') return;
    const ac = audioCtx, now = ac.currentTime;
    if(!noiseBuf){
      noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate*0.7), ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    }
    // 1) pop: rychle klesající tón (plyn vyrazí kapsli) + krátké kovové cinknutí
    const pop = ac.createOscillator(), pg = ac.createGain();
    pop.type = 'sine';
    pop.frequency.setValueAtTime(820, now);
    pop.frequency.exponentialRampToValueAtTime(150, now + 0.07);
    pg.gain.setValueAtTime(0.0001, now);
    pg.gain.exponentialRampToValueAtTime(0.5, now + 0.004);
    pg.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
    pop.connect(pg); pg.connect(ac.destination);
    pop.start(now); pop.stop(now + 0.1);
    [[3400, 0.02], [5200, 0.012]].forEach(([f, dur])=>{
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'square'; o.frequency.setValueAtTime(f*(0.97+Math.random()*0.06), now);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.07, now + 0.002);
      g.gain.exponentialRampToValueAtTime(0.0001, now + dur + 0.03);
      o.connect(g); g.connect(ac.destination);
      o.start(now); o.stop(now + dur + 0.05);
    });
    // 2) psssst: filtrovaný šum, rychlý nástup a pomalé doznívání
    const ns = ac.createBufferSource(); ns.buffer = noiseBuf;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 6500; bp.Q.value = 0.7;
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3000;
    const ng = ac.createGain();
    ng.gain.setValueAtTime(0.0001, now + 0.03);
    ng.gain.exponentialRampToValueAtTime(0.28, now + 0.06);
    ng.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
    ns.connect(bp); bp.connect(hp); hp.connect(ng); ng.connect(ac.destination);
    ns.start(now + 0.03); ns.stop(now + 0.55);
  }

  // "Písk-píííísk": krátké pípnutí, malá pauza, a pak ten dlouhý tón s vibratem
  // (viz níže) - napodobuje typické dvojité fouknutí do policejní píšťalky.
  function playWhistleSound(){
    if(!audioCtx || audioCtx.state !== 'running') return;
    const now = audioCtx.currentTime;
    const baseFreq = 1300;

    // Krátké "písk" - stejná výška, jen bez vibrata a hodně krátké.
    const shortOsc = audioCtx.createOscillator();
    shortOsc.type = 'triangle';
    shortOsc.frequency.setValueAtTime(baseFreq, now);
    const shortGain = audioCtx.createGain();
    shortGain.gain.setValueAtTime(0.0001, now);
    shortGain.gain.exponentialRampToValueAtTime(0.2, now+0.02);
    shortGain.gain.exponentialRampToValueAtTime(0.0001, now+0.12);
    shortOsc.connect(shortGain); shortGain.connect(audioCtx.destination);
    shortOsc.start(now); shortOsc.stop(now+0.13);

    // Dlouhé "píííísk" - nastupuje s malou pauzou po tom krátkém.
    const longStart = now + 0.19;
    const dur = 0.9;
    const carrier = audioCtx.createOscillator();
    carrier.type = 'triangle';
    carrier.frequency.setValueAtTime(baseFreq, longStart);

    const lfo = audioCtx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.setValueAtTime(22, longStart); // rychlost "kolotání" kuličky
    const lfoGain = audioCtx.createGain();
    lfoGain.gain.setValueAtTime(55, longStart); // hloubka vibrata v Hz
    lfo.connect(lfoGain); lfoGain.connect(carrier.frequency);

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.0001, longStart);
    gain.gain.exponentialRampToValueAtTime(0.22, longStart+0.06);
    gain.gain.setValueAtTime(0.22, longStart+dur-0.18);
    gain.gain.exponentialRampToValueAtTime(0.0001, longStart+dur);

    carrier.connect(gain); gain.connect(audioCtx.destination);
    lfo.start(longStart); carrier.start(longStart);
    lfo.stop(longStart+dur); carrier.stop(longStart+dur);
  }

  // Ambientní "šum" proudu při čůrání na úvodní obrazovce - filtrovaný šum
  // (bandpass), jehož hlasitost se každý snímek napojuje na flowFade
  // (viz introLoop), takže zeslábne přesně s tím, jak proud mizí.
  let peeNoiseSource = null, peeNoiseGain = null;
  function startPeeSound(){
    if(!audioCtx || peeNoiseSource) return;
    const bufferSize = audioCtx.sampleRate*2;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++) data[i] = Math.random()*2-1;
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer; noise.loop = true;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass'; filter.frequency.value = 1100; filter.Q.value = 0.6;
    const gain = audioCtx.createGain(); gain.gain.value = 0;
    noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    noise.start();
    peeNoiseSource = noise; peeNoiseGain = gain;
  }
  function setPeeVolume(v){
    if(!peeNoiseGain || !audioCtx) return;
    peeNoiseGain.gain.setTargetAtTime(v, audioCtx.currentTime, 0.05);
  }
  function stopPeeSound(){
    if(!peeNoiseSource) return;
    const src = peeNoiseSource, g = peeNoiseGain;
    peeNoiseSource = null; peeNoiseGain = null;
    try{ g.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1); }catch(e){}
    setTimeout(()=>{ try{ src.stop(); }catch(e){} }, 300);
  }

  // RUČNÍ ODBOČENÍ: v pruhu se šipkou hráč musí zmáčknout / swipnout do směru, kam odbočka vede.
  // Povel se přijímá už ~TURN_INPUT_AHEAD jednotek před šipkou (pak se odbočí přesně na ní)
  // a ještě TURN_GRACE jednotek po ní (pozdní reakce = odbočí hned). Šipka v pruhu, ve kterém
  // hráč není, nebo bez povelu = hráč jede rovně.
  const TURN_INPUT_AHEAD = 24, TURN_GRACE = 2.5;
  function tryTurnInput(dir){
    if(turnAnim || slipping || busting || parkedCar) return false;
    for(const p of roadPieces){
      if(p.rot || !p.arrows) continue;
      for(const a of p.arrows){
        if(a.used || a.dir !== dir || Math.abs(a.lane - currentLane) > 0.01) continue;
        const d = p.g.position.z + a.lz;               // < 0 = šipka je před hráčem
        if(d < -TURN_INPUT_AHEAD || d > TURN_GRACE) continue;
        a.armed = true;
        if(d >= 0){ a.used = true; doTurn(p, a); }     // šipku už míjí: odbočí hned
        return true;
      }
    }
    return false;
  }
  // Přeřazení do pruhu s policejním autem z boční ulice ve chvíli, kdy je hráč vedle něj (s malou
  // tolerancí před / po), = náraz zboku -> cut scéna s močením.
  // Auto ze zastávky je v dosahu (od vzniku daleko před hráčem až těsně za něj) -> policista se neobjeví.
  function pcrNear(){
    for(const o of obstacles) if(o.pcr && !o.dead && o.mesh.position.z > -200 && o.mesh.position.z < 8) return true;
    return false;
  }
  function tryPcrSideHit(dir){
    if(!running || turnAnim || slipping || busting || testGhost || chaseActive || bottleScore < 1) return false;
    const tgt = currentLane + dir, lo = roadLo, hi = lo + roadN - 1;
    if(tgt < lo - 1e-6 || tgt > hi + 1e-6) return false;
    for(const o of obstacles){
      if(!o.pcr || Math.abs(o.lane - tgt) > 0.01) continue;
      const zN = o.mesh.position.z + o.lenHalf, zF = o.mesh.position.z - o.lenHalf;
      if(zN >= -PCR_SIDE_LEAD && zF <= PCR_SIDE_TAIL){ startPeeCutscene(); return true; }
    }
    return false;
  }
  function changeLane(dir){
    if(tryTurnInput(dir)) return;
    if(tryPcrSideHit(dir)) return;
    const lo = roadLo, hi = lo + roadN - 1;   // pruhy aktuální silnice
    currentLane = Math.max(lo, Math.min(hi, currentLane+dir));
    targetX = laneXOf(currentLane);
  }
  function doJump(){ tryJump(); }
  function doFastFall(){
    if(!running || P.grounded || busting || slipping) return;
    P.fast = true; P.jumpBuf = 0; P.coyote = 0;
    if(P.vy > -FAST_FALL_V0) P.vy = -FAST_FALL_V0;
  }

  window.addEventListener('keydown', e=>{
    if(e.key==='Enter' && !e.repeat && !running){
      const tg = e.target && e.target.tagName;
      if(tg==='INPUT' || tg==='TEXTAREA' || tg==='SELECT' || tg==='BUTTON') return;   // tlačítko si Enter obslouží samo
      e.preventDefault();
      requestStart();
      return;
    }
    if(!running) return;
    if(e.key==='ArrowLeft') changeLane(-1);
    else if(e.key==='ArrowRight') changeLane(1);
    else if(e.key==='ArrowUp' || e.key===' ') doJump();
    else if(e.key==='ArrowDown') doFastFall();
  });
  let touchStartX=0, touchStartY=0, touchActive=false;
  canvas.addEventListener('touchstart', e=>{ const t=e.touches[0]; touchStartX=t.clientX; touchStartY=t.clientY; touchActive=true; }, {passive:true});
  canvas.addEventListener('touchend', e=>{
    if(!touchActive) return; touchActive=false;
    const t=e.changedTouches[0];
    const dx=t.clientX-touchStartX, dy=t.clientY-touchStartY;
    if(Math.abs(dx)>Math.abs(dy) && Math.abs(dx)>30) changeLane(dx>0?1:-1);
    else if(dy<-30) doJump();
    else if(dy>30 && Math.abs(dy)>Math.abs(dx)){ if(running) doFastFall(); }
    else if(!running) requestStart();
  }, {passive:true});
  canvas.addEventListener('click', ()=>{ if(!running) requestStart(); });
  window.addEventListener('resize', resize);

  function requestStart(){
    unlockAudio(); // jistota odemčení uvnitř tohoto gesta (viz komentář u unlockAudio)
    if(testSeg){ if(!running) startTest(); return; }
    if(introActive) beginStop();
    else if(!running) playRestartSwoop();
  }

  // --- RESTART: kamera vzlétne vysoko nahoru (kde není vidět, že se scéna
  // mění), tam se potichu vymění zbytky z minulé hry za čerstvou úvodní scénu
  // (auto + čůrání), a kamera se pak plynule vrátí dolů - podobně jako
  // přepínání postav v GTA V. Následně se úvodní scéna sama (bez klikání)
  // přehraje až do doběhnutí policisty a startu hry.
  let swoopPhase = null, swoopT0, swoopStartCam, swoopStartLook, deferredCar = null, swoopLookOverride = null, swoopFov0 = 60, swoopFov1 = 60;
  const SWOOP_UP_DUR = 0.4, SWOOP_DOWN_DUR = 0.55;
  const SWOOP_PEAK_POS = new THREE.Vector3(0, 42, 6);
  const SWOOP_PEAK_LOOK = new THREE.Vector3(0, 0, -25);

  function playRestartSwoop(){
    if(swoopPhase) return;
    hideMenu();
    hideGameOver();
    overlay.classList.add('hidden');
    cutKeep = false;
    autoAdvanceAt = 1.7 + SWOOP_DOWN_DUR; peePts = 0; peeGot = 0;   // běžný restart: krátké močení bez bodů (+ doba sestupu kamery, během které scéna už běží)
    // Auto, přes které visel punkáč, a celou starou scénu necháme na místě, dokud
    // kamera nevyletí nahoru (tam se vše potichu vymění, včetně prostředí -> město).
    deferredCar = bustObstacle; bustObstacle = null;
    hitFlash.style.opacity = '0';
    swoopPhase = 'up'; swoopT0 = undefined;
    requestAnimationFrame(swoopLoop);
  }

  // Vymění scénu za čerstvou úvodní (auto + čůrání). Volá se potichu nahoře při vzletu
  // kamery (restart) nebo rovnou při střihu u policejního auta (autoLoop = spustí introLoop sám).
  function enterIntroScene(autoLoop){
    stopPeeSound();
    if(introCar){ scene.remove(introCar); introCar = null; }
    if(peeStream){ scene.remove(peeStream); peeStream = null; }
    if(splashCircle){ scene.remove(splashCircle); splashCircle = null; }
    drips.forEach(d=>scene.remove(d)); drips = [];
    if(puddle){ scene.remove(puddle); puddle = null; }
    if(deferredCar){ scene.remove(deferredCar); deferredCar = null; }
    playerGroup.rotation.set(0,0,0);
    playerGroup.position.set(0,0,0);
    copGroup.visible = false;
    stopping = false; stopT = 0;
    introActive = true;
    autoAdvance = true;
    buildIntroScene(autoLoop);
  }

  function swoopLoop(t){
    if(swoopT0===undefined){
      swoopT0 = t;
      swoopStartCam = camera.position.clone();
      swoopStartLook = (swoopLookOverride || GAME_LOOKAT).clone(); swoopLookOverride = null;
      swoopFov0 = camera.fov;
      const keepFov = camera.fov; fitFov(); swoopFov1 = camera.fov; camera.fov = keepFov; camera.updateProjectionMatrix();   // cílové FOV podle poměru stran
    }
    const time = (t-swoopT0)/1000;

    if(swoopPhase==='up'){
      const tt = Math.min(time/SWOOP_UP_DUR, 1);
      const ease = tt*tt;
      camera.position.lerpVectors(swoopStartCam, SWOOP_PEAK_POS, ease);
      if(swoopFov0 !== swoopFov1){ camera.fov = swoopFov0 + (swoopFov1 - swoopFov0)*ease; camera.updateProjectionMatrix(); }
      camera.lookAt(new THREE.Vector3().lerpVectors(swoopStartLook, SWOOP_PEAK_LOOK, ease));
      renderer.render(scene, camera);
      if(tt>=1){
        // Nahoře je scéna daleko mimo záběr - potichu ji vyměníme za úvodní.
        reset(false);              // úklid minulé hry, skóre na nulu, prostředí zpět na město
        enterIntroScene(false);
        swoopPhase = 'down'; swoopT0 = t;
        requestAnimationFrame(introLoop);   // úvodní scéna (včetně pózy postavy) běží už od začátku sestupu kamery
        return;
      }
      requestAnimationFrame(swoopLoop);
      return;
    }
  }

  function finishStart(){
    // Konec úvodní scény: zastavíme introLoop, uklidíme auto/proud/stříkanec.
    // Postava už je otočená plynule z beginStop/introLoop, kamera se do herní
    // pozice přesune plynule v loop() (viz camBlendActive) - žádný skok.
    introActive = false;
    autoAdvance = false;
    autoAdvanceAt = 1.7; peePts = 0; peeGot = 0;
    stopPeeSound();
    if(introCar){ scene.remove(introCar); introCar = null; }
    if(peeStream){ scene.remove(peeStream); peeStream = null; }
    if(splashCircle){ scene.remove(splashCircle); splashCircle = null; }
    drips.forEach(d=>scene.remove(d)); drips = [];
    if(puddle){ scene.remove(puddle); puddle = null; }
    if(copGroup){ copGroup.visible = false; }
    playerGroup.rotation.y = 0;
    camBlendT = 0; camBlendActive = true;

    reset(cutKeep);
    cutKeep = false;
    updateHud();
    running = true;
    overlay.classList.add('hidden');
    lastT = performance.now();
    requestAnimationFrame(loop);
  }
  startBtn.addEventListener('click', requestStart);

  // --- TESTOVACÍ REŽIM: příjem segmentu z editoru (iframe) ---------------
  function startTest(){
    hideMenu();
    hideGameOver();
    overlay.classList.add('hidden');
    coinsEl.textContent='0'; scoreEl.textContent='0'; bottlesEl.textContent='0';
    if(running){ reset(); }          // hra už běží -> jen rychlý restart trati
    else { finishStart(); }          // přeskočí úvodní scénu a rovnou spustí běh
    chaseTimer = 1e9;                // v testu bez policisty
    camBlendActive = false;
    camera.position.copy(GAME_CAM_POS); camera.lookAt(GAME_LOOKAT);
  }
  window.addEventListener('message', function(e){
    const d = e.data;
    if(!d || d.type !== 'pr-test-segment' || !d.segment) return;
    const raw = d.segment, OK = ['coin','bottle','puddle','car','arrow_left','arrow_right'];
    const nl = clampN(raw.lanes);
    const items = (Array.isArray(raw.items) ? raw.items : [])
      .filter(it => it && OK.indexOf(it.type) >= 0)
      .map(it => ({ type: it.type, lane: Math.max(0, Math.min(nl-1, Math.round(Number(it.lane)||0))),
                    z: Math.max(0, Number(it.z)||0), flipped: !!it.flipped,
                    model: (typeof it.model === 'string') ? it.model : undefined }));
    testSeg = { id: 'test-' + (raw.id || 'x'), length: Math.max(8, Number(raw.length)||24), lanes: nl, align: (['left','right','center'].indexOf(raw.align) >= 0 ? raw.align : undefined), biome: (BIOMES[raw.biome] ? raw.biome : undefined), items: items };
    testGhost = !!d.ghost;
    startTest();
  });

  // --- GAME OVER obrazovka (vestavěná, bez prohlížečových dialogů) ---
  const goPanel = document.getElementById('goPanel'), hudEl = document.getElementById('hud');
  const goName = document.getElementById('goName'), goSaveBtn = document.getElementById('goSaveBtn'), goSaveMsg = document.getElementById('goSaveMsg');
  let goToken = 0, goTotal = 0, goSaved = false, goSaving = false;

  function hideGameOver(){
    goToken++;
    goPanel.classList.add('hidden');
    overlay.classList.remove('go');
    msg.style.display = '';
    if(startBtn.parentNode === goPanel) overlay.appendChild(startBtn);
    hudEl.style.visibility = '';
  }

  async function saveScore(){
    if(goSaved || goSaving) return;
    const name = goName.value.trim().slice(0,16);
    if(!name){ goSaveMsg.textContent = 'Napiš prosím jméno.'; return; }
    goSaving = true; goSaveBtn.disabled = true; goSaveMsg.textContent = 'Ukládám…';
    const token = goToken;
    addLocalScore(name, goTotal);          // interní žebříček se vede vždy
    let error = null;
    try{ ({ error } = await db.from('scores').insert([{ player_name:name, score:goTotal, game:'pee-runner' }])); }
    catch(e){ error = e; }
    goSaving = false;
    goSaved = true; goName.disabled = true;
    try{ localStorage.setItem('punkRunnerName', name); }catch(e){}
    if(error){
      console.error('Chyba při ukládání skóre:', error);
      goSaveMsg.textContent = 'Server nedostupný, skóre je uložené jen v tomto zařízení ✓';
    } else {
      goSaveMsg.textContent = 'Uloženo ✓';
      scoresOnline = true;   // server evidentně funguje (první načtení mohlo jen vrátit prázdnou tabulku)
    }
    const r = await getScores(3);
    if(token === goToken){ const el = document.getElementById('goTopList'); fillScoreRows(el, r.data, false); markLocal(el, r.local); }
  }
  // Návrat z game over do hlavního menu: úklid scény do stejného stavu jako při prvním startu.
  function toMenu(){
    hideGameOver();
    reset(false);
    obstacles.forEach(o=>scene.remove(o.mesh)); coins.forEach(c=>scene.remove(c.mesh)); bottles.forEach(b=>scene.remove(b.mesh));
    obstacles = []; coins = []; bottles = [];
    roadPieces.forEach(pc=>{ scene.remove(pc.g); disposePiece(pc); }); roadPieces = [];
    resetBiomes(); roadN = 3; lastRoadN = 3; roadLo = 1; lastRoadLo = 1; camCX = 0; camTargetX = 0; camZoom = 1;
    buildSegmentRoad(3, 1, 22, -150, [], 'city');
    setAtmosphere('city');
    camBlendActive = false; busting = false;
    updateHud();
    menuStep(0);          // hned vykreslí pózu + kameru menu, ať se ani na snímek neukáže stará scéna
    showMenu();
  }
  document.getElementById('goBack').addEventListener('click', toMenu);
  goSaveBtn.addEventListener('click', saveScore);
  goName.addEventListener('keydown', e=>{ e.stopPropagation(); if(e.key === 'Enter'){ e.preventDefault(); saveScore(); } });

  async function endGame(){
    running = false;
    clearSegLabel();
    if(testSeg){ // test z editoru: žádné ukládání skóre ani žebříček
      hideGameOver();
      msg.innerHTML = '<strong>Konec testu</strong><br>Skóre: ' + score + '<br><br>Klepni pro další pokus';
      startBtn.textContent = 'ZNOVU';
      overlay.classList.remove('hidden');
      return;
    }
    const total = score;
    goTotal = total; goSaved = false; goSaving = false;
    const token = ++goToken;

    // Lokální best můžeme dál aktualizovat i bez připojení.
    if(total > best){
        best = total;
        try{ localStorage.setItem('punkRunnerBest3D', String(best)); }catch(e){}
    }
    bestEl.textContent = best;

    // Obrazovka se ukáže hned, žebříček a hlášky o umístění se doplní, až dorazí data.
    document.getElementById('goReason').textContent = crashText;
    document.getElementById('goScore').textContent = 'Skóre: ' + total;
    document.getElementById('goCoins').textContent = coinScore;
    document.getElementById('goBottles').textContent = totalBottles;
    document.getElementById('goPeed').textContent = carsPeed;
    const rankEl = document.getElementById('goRank');
    rankEl.className = 'hidden'; rankEl.textContent = '';
    const topEl = document.getElementById('goTopList');
    topEl.textContent = ''; const ld = document.createElement('div'); ld.className = 'mMuted'; ld.textContent = 'Načítám…'; topEl.appendChild(ld);
    goName.disabled = false; goSaveBtn.disabled = false; goSaveMsg.textContent = '';
    try{ goName.value = localStorage.getItem('punkRunnerName') || ''; }catch(e){ goName.value = ''; }
    document.getElementById('goSave').style.display = total > 0 ? '' : 'none';

    msg.style.display = 'none';
    goPanel.classList.remove('hidden');
    goPanel.appendChild(startBtn);          // tlačítko HRÁT ZNOVU úplně dole pod žebříčkem
    startBtn.textContent = 'HRÁT ZNOVU';
    overlay.classList.add('go');
    hudEl.style.visibility = 'hidden';
    overlay.classList.remove('hidden');
    overlay.scrollTop = 0;

    // Načtení TOP 3 z žebříčku + zjištění, jestli se hráč do něj vešel.
    const got = await getScores(3);         // externí, a když není dostupný, interní žebříček
    const top = got.data;
    if(token !== goToken) return;           // hráč mezitím začal novou hru
    fillScoreRows(topEl, top, false); markLocal(topEl, got.local);

    if(total > 0){
      let place = -1;
      if(top.length){
        place = top.findIndex(r => total > r.score);
        if(place === -1 && top.length < 3) place = top.length;
      } else { place = 0; }                  // prázdný žebříček = každé skóre je rekord
      if(place === 0){ rankEl.textContent = '🏆 REKORD!!!'; rankEl.className = 'rec'; }
      else if(place > 0){ rankEl.textContent = '⭐ Skvělé! Jsi ' + (place+1) + '. nejlepší hráč!'; rankEl.className = ''; }
    }
  }

  let lastT=0;
  function loop(t_now){
    if(!running) return;
    const dt = Math.min((t_now-lastT)/1000, 0.05);
    lastT = t_now;

    if(busting){
      updateBust(dt);
      if(running) requestAnimationFrame(loop);
      return;
    }

    T += dt;

    moveSpeed += dt*5;
    if(moveSpeed>50) moveSpeed=50;

    if(slipping){ const k = Math.max(0, 1 - slipT/slipSlideDur); moveSpeed = slipV0*k*k; }   // svět při uklouznutí brzdí do zastavení
    dist += moveSpeed*dt;

    playerGroup.position.x += (targetX - playerGroup.position.x) * Math.min(dt*10,1);

    // Zatáčení: hráč i kamera se dotáčejí z úhlu staré cesty do nového směru.
    let turnE = -1, turnSave = null;
    if(turnAnim){
      turnSave = turnAnim;
      turnAnim.t += dt/TURN_DUR;
      const tt = Math.min(turnAnim.t, 1);
      turnE = tt<0.5 ? 2*tt*tt : 1-Math.pow(-2*tt+2,2)/2;
      // Postava se otáčí hned a rychle (ease-out) a do zatáčky se nakloní; kamera ji dotáčí pomaleji.
      const yp = Math.min(turnAnim.t*TURN_DUR/TURN_YAW_DUR, 1);
      const yE = 1 - Math.pow(1-yp, 3);
      turnYaw = turnAnim.theta*(1-yE);
      if(!slipping){
        playerGroup.rotation.y = turnYaw;
        playerGroup.rotation.z = -turnAnim.dir*0.26*Math.sin(Math.PI*Math.min(turnAnim.t*TURN_DUR/(TURN_YAW_DUR*1.9), 1));
      }
      if(turnAnim.t >= 1){ turnAnim = null; turnYaw = 0; if(!slipping){ playerGroup.rotation.y = 0; playerGroup.rotation.z = 0; } }
    }

    if(camBlendActive){
      camBlendT += dt/CAM_BLEND_DURATION;
      const tt = Math.min(camBlendT,1);
      const ease = tt<0.5 ? 2*tt*tt : 1-Math.pow(-2*tt+2,2)/2; // easeInOutQuad
      camera.position.lerpVectors(INTRO_CAM_POS, GAME_CAM_POS, ease);
      const look = new THREE.Vector3().lerpVectors(INTRO_LOOKAT, GAME_LOOKAT, ease);
      camera.lookAt(look);
      if(tt>=1) camBlendActive = false;
    } else if(!slipping){
      // Když hráč běží po střechách, kamera se plynule zvedne s ním.
      camElev += (P.support*0.55 - camElev) * Math.min(dt*4, 1);
      const camPos = new THREE.Vector3(GAME_CAM_POS.x + camCX, GAME_CAM_POS.y*camZoom + camElev, GAME_CAM_POS.z*camZoom);
      const camLook = new THREE.Vector3(GAME_LOOKAT.x + camCX, GAME_LOOKAT.y + camElev, GAME_LOOKAT.z);
      if(turnE >= 0 && turnSave){
        camPos.lerpVectors(turnSave.camFrom, camPos, turnE);
        camLook.lerpVectors(turnSave.lookFrom, camLook, turnE);
      }
      camera.position.copy(camPos);
      camera.lookAt(camLook);
    }
    
    // --- RADY3 ANIMATION INTEGRATION ---
    phase += dt * moveSpeed * 0.55;
    if(slipping){
      // Svět kolem (silnice, budovy, provoz) běží dál normálně -
      // nahrazujeme jen animaci hráče, ne celou hru.
      if(updateSlip(dt) === 'bust'){ startBust('puddle', null); requestAnimationFrame(loop); return; }
    } else {
      applyPose();
    }
    // -----------------------------------

    // Občasná honička policistou - objeví se těsně za hráčem, doběhne stejným
    // tempem a po chvíli zase odpadne do dálky/zmizí, v náhodných intervalech.
    if(!slipping){
      chaseTimer -= dt;
      if(!chaseActive && chaseTimer<=0 && !pcrNear()){
        chaseActive = true; chaseT = 0;
        copGroup.visible = true;
        copGroup.rotation.y = Math.PI; // běží stejným směrem jako hráč (pryč od kamery)
        copGroup.position.set(playerGroup.position.x, 0, 3.0);
        copPhase = phase; // navázaný na stejný běžecký cyklus jako hráč
        playWhistleSound();
      }
      if(chaseActive){
        chaseT += dt;
        copPhase += dt*moveSpeed*0.55;
        applyCopPose(copPhase);
        copGroup.position.x += (playerGroup.position.x - copGroup.position.x)*Math.min(dt*6,1);
        copGroup.position.z = 3.0 + Math.sin(chaseT*2)*0.15;
        copGroup.position.y += (surfaceAt(currentLane, 3.0, null).h - copGroup.position.y) * Math.min(dt*8, 1);
        if(chaseT>=CHASE_DURATION){
          chaseActive = false;
          copGroup.visible = false;
          chaseTimer = 10 + Math.random()*12;
        }
      }
    }

    dashes.forEach(d=>{
      d.mesh.position.z += moveSpeed*dt;
      if(d.mesh.position.z > 9){ d.mesh.position.z -= 56; }
    });
    updateAtmosphere(dt, false);   // barva mlhy / oblohy plynule přechází do prostředí před hráčem

    // Segmenty trati - fronta se musí posouvat spolu se světem (stejně
    // jako pozice překážek), jinak si ensureSegmentsAhead() bude myslet,
    // že má napořád dost napřipraveno, a přestane generovat další.
    spawnCursorZ += moveSpeed*dt;
    segRecs.forEach(r=>{ r.z0 += moveSpeed*dt; r.z1 += moveSpeed*dt; });
    segRecs = segRecs.filter(r=>r.z1 < 14);
    setSegLabel(segRecs.find(r=>r.z0 >= 0 && r.z1 < 0) || null);
    ensureSegmentsAhead();

    // Silnice: kousky se posouvají se světem; staré mizí za hráčem.
    for(const p of roadPieces) p.g.position.z += moveSpeed*dt;
    roadPieces = roadPieces.filter(p=>{
      if(p.g.position.z - p.hz > 22){ scene.remove(p.g); disposePiece(p); return false; }
      return true;
    });
    updateRoadState(dt);

    // --- PCR1 LIGHTS FLASHING ---
    const on=((performance.now()/1000)*3)%1<.5;
    M.beaconL.emissiveIntensity=on?2.8:.2;
    M.beaconR.emissiveIntensity=on?.2:2.8;
    for(let i=0;i<BEACON_MATS.length;i+=2){ BEACON_MATS[i].emissiveIntensity=on?2.8:.2; BEACON_MATS[i+1].emissiveIntensity=on?.2:2.8; }

    for(const o of obstacles) o.mesh.position.z += moveSpeed*dt;
    // Signál "můžeš močit": když se v zastávce objeví policejní auto, okraj obrazovky třikrát zabliká žlutě.
    for(const o of obstacles){
      if(o.peeStopFlash === false && !o.dead && o.mesh.position.z > -moveSpeed*0.3){   // !dead: auta ze staré trati po odbočce už nic nespouští   // ~0,3 s před tím, než hráč auto mine
        o.peeStopFlash = true;
        if(bottleScore >= 1 && !chaseActive && !testGhost){
          const pf = document.getElementById('peeFlash');
          pf.classList.remove('on'); void pf.offsetWidth; pf.classList.add('on');
        }
      }
    }

    if(!slipping){
      // Výška hráče: skok, rampa, střechy vozidel; případný náraz do vozidla.
      const crash = stepVertical(dt);
      playerGroup.position.y = P.y;
      if(crash){
        // Policejní auto z boční ulice: dostatečně hluboko = zboku -> cut scéna; těsně na začátku = zezadu -> game over.
        if(crash.pcr && bottleScore >= 1 && !chaseActive && (crash.mesh.position.z + crash.lenHalf) > PCR_SIDE_DEPTH){ startPeeCutscene(); return; }
        bustBaseY = surfaceAt(currentLane, 0, crash).h;      // kde hráč stál, než narazil
        obstacles = obstacles.filter(x=>x!==crash);
        const sideHit = (crash.mesh.position.z + crash.lenHalf) > PCR_SIDE_DEPTH;   // auto už je hráči "po boku" = náraz zboku (ne čelní)
        startBust('car', crash.mesh, sideHit);
        requestAnimationFrame(loop);
        return;
      }
      // Louže: uklouznutí, pokud hráč není dost vysoko (skok / střecha).
      if(!testGhost){
        for(const o of obstacles){
          if(o.isPuddle && !o.resolved && o.lane===currentLane && o.mesh.position.z > -o.zHalf && o.mesh.position.z < o.zHalf && P.y < o.jumpReq){
            // Louže zůstává v poli překážek a jede dál se světem (jako by byla součástí silnice).
            o.resolved = true;
            startSlip(o);
            requestAnimationFrame(loop);
            return;
          }
        }
      }
    }
    obstacles = obstacles.filter(o=>{
      if(o.mesh.position.z > 9 + (o.lenHalf||0)){ scene.remove(o.mesh); return false; }
      return true;
    });

    for(const c of coins){
      if(c.collected) continue;
      c.mesh.position.z += moveSpeed*dt;
      if(c.dead){ if(c.mesh.position.z > 9){ scene.remove(c.mesh); c.collected = true; } continue; }   // zbytek staré silnice po odbočce
      c.mesh.rotation.z += dt*4;
      if(c.lane===currentLane && Math.abs(c.mesh.position.z) < 0.9 && Math.abs(P.y - (c.baseY||0)) < 1.7){
        c.collected = true;
        scene.remove(c.mesh);
        coinScore++;
        playCoinSound();
        recalcScore();
        coinsEl.textContent = coinScore;
      }
    }
    coins = coins.filter(c=>{
      if(c.collected) return false;
      if(c.mesh.position.z > 9){ scene.remove(c.mesh); return false; }
      return true;
    });

    for(const b of bottles){
      if(b.collected) continue;
      b.mesh.position.z += moveSpeed*dt;
      if(b.dead){ if(b.mesh.position.z > 9){ scene.remove(b.mesh); b.collected = true; } continue; }
      b.mesh.rotation.y += dt*3;
      if(b.lane===currentLane && Math.abs(b.mesh.position.z) < 0.9 && Math.abs(P.y - (b.baseY||0)) < 1.7){
        b.collected = true;
        scene.remove(b.mesh);
        bottleScore++; totalBottles++;
        playBottleSound();
        recalcScore();
        bottlesEl.textContent = bottleScore;
      }
    }
    bottles = bottles.filter(b=>{
      if(b.collected) return false;
      if(b.mesh.position.z > 9){ scene.remove(b.mesh); return false; }
      return true;
    });

    // Křižovatky: odbočí se jen na povel hráče (viz tryTurnInput). Šipka, která hráče přeběhne
    // bez povelu (nebo když už stojí v jiném pruhu), propadne a hráč jede rovně.
    if(!turnAnim && !slipping){
      outer: for(const p of roadPieces){
        if(p.rot) continue;
        for(const a of p.arrows){
          if(a.used) continue;
          if(p.g.position.z + a.lz >= 0){
            a.used = true;
            if(a.armed && Math.abs(a.lane - currentLane) < 0.01){ doTurn(p, a); break outer; }
          }
        }
      }
    }

    // Policista z honičky se při zatáčení otáčí s hráčem.
    if(turnAnim && chaseActive) copGroup.rotation.y = Math.PI + turnYaw;

    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }

  // =====================================================================
  // HLAVNÍ MENU: detail punkáče od hlavy po pás vpravo (rozhlíží se jako v úvodní scéně),
  // vlevo HRÁT / ŽEBŘÍČEK / TOP 3 a dole ZPĚT. HRÁT spustí stejný přechod jako restart (GTA vzlet kamery).
  // =====================================================================
  const IN_EDITOR = (function(){ try{ return window.parent && window.parent !== window; }catch(e){ return true; } })();
  const BACK_URL = 'https://hudebka.github.io/web/';
  const MENU_FOV = 35, MENU_FACE = Math.PI - 0.4;   // MENU_FACE: čelem ke kameře, mírně natočený k tlačítkům vlevo
  const menuEl = document.getElementById('menu'), boardEl = document.getElementById('board');
  const menuLook = new THREE.Vector3();
  let menuActive = false, menuT0;

  function applyMenuCamera(){
    const aspect = window.innerWidth / window.innerHeight;
    const Hv = aspect >= 1 ? 1.25 : Math.max(1.25, 1.05/aspect);        // výška záběru (na výšku se musí vejít šířka postavy)
    const Wv = Hv*aspect;
    const d = Hv / (2*Math.tan(THREE.MathUtils.degToRad(MENU_FOV/2)));
    const yc = 0.80 + Hv/2;                                             // spodek obrazovky ≈ pas
    const shift = 0.22*Wv;                                              // postava se posune doprava
    camera.fov = MENU_FOV; camera.aspect = aspect; camera.updateProjectionMatrix();
    camera.position.set(-shift, yc, d);
    menuLook.set(-shift, yc, 0);
    camera.lookAt(menuLook);
  }

  function menuLoop(t){
    if(!menuActive) return;
    if(menuT0 === undefined) menuT0 = t;
    const time = (t - menuT0)/1000;
    menuStep(time);
    requestAnimationFrame(menuLoop);
  }
  function menuStep(time){
    playerGroup.position.set(0,0,0);
    playerGroup.rotation.set(0, MENU_FACE + 0.08*Math.sin(time*0.7), 0);
    applyIntroPose(time);                       // dýchání + rozhlížení (stejně jako v úvodní scéně)
    arms.forEach(A=>{                           // ruce volně podél těla (v úvodní scéně je jedna zvednutá k čůrání)
      A.sh.rotation.x = -0.1 + 0.03*Math.sin(time*0.6 + A.side); A.sh.rotation.z = A.side*0.1; A.el.rotation.x = -0.2;
    });
    applyMenuCamera();
    renderer.render(scene, camera);
  }

  function fillScoreRows(el, data, withRank){
    el.textContent = '';
    if(!data || !data.length){ const m = document.createElement('div'); m.className = 'mMuted'; m.textContent = 'Zatím žádná skóre'; el.appendChild(m); return; }
    data.forEach((r, i)=>{
      const row = document.createElement('div'); row.className = 'mRow';
      const rk = document.createElement('span'); rk.className = 'rk'; rk.textContent = (i+1) + '.';
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = r.player_name || '???';
      const sc = document.createElement('span'); sc.className = 'sc'; sc.textContent = r.score;
      if(withRank) row.appendChild(rk); else nm.textContent = (i+1) + '. ' + nm.textContent;
      row.appendChild(nm); row.appendChild(sc);
      el.appendChild(row);
    });
  }
  async function fetchScores(limit){
    await scoresProbe;                                  // počká na první (jediný rozhodující) pokus
    if(scoresOnline === false) throw new Error('scores-offline');   // první pokus nic nevrátil -> už se nezkouší
    const { data, error } = await db.from('scores').select('player_name, score').eq('game', 'pee-runner').order('score', { ascending:false }).limit(limit);
    if(error) throw error;
    return data;
  }
  // INTERNÍ ŽEBŘÍČEK (localStorage): použije se, když se externí nepodaří načíst.
  // Skóre se ukládá do něj vždy, takže při výpadku serveru má hráč aspoň vlastní historii.
  const LOCAL_KEY = 'punkRunnerLocalScores';
  function readLocalScores(){
    try{ const a = JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]'); return Array.isArray(a) ? a : []; }catch(e){ return []; }
  }
  function addLocalScore(name, sc){
    try{
      const a = readLocalScores(); a.push({ player_name:name, score:sc });
      a.sort((x,y)=>y.score - x.score);
      localStorage.setItem(LOCAL_KEY, JSON.stringify(a.slice(0,100)));
    }catch(e){}
  }
  // Vrátí { data, local }: externí žebříček, a když není dostupný, interní.
  async function getScores(limit){
    try{ return { data: await fetchScores(limit), local:false }; }
    catch(e){ return { data: readLocalScores().slice(0, limit), local:true }; }
  }
  function markLocal(el, local){
    const old = el.parentNode && el.parentNode.querySelector('.mLocalNote'); if(old) old.remove();
    if(!local) return;
    const n = document.createElement('div'); n.className = 'mMuted mLocalNote'; n.textContent = 'Offline: skóre jen v tomto zařízení';
    el.parentNode.insertBefore(n, el.nextSibling);
  }
  async function loadMenuTop3(){
    const el = document.getElementById('mTopList');
    const r = await getScores(3);
    fillScoreRows(el, r.data, false); markLocal(el, r.local);
  }
  async function openBoard(){
    const list = document.getElementById('boardList');
    list.textContent = ''; const m = document.createElement('div'); m.className = 'mMuted'; m.textContent = 'Načítám…'; list.appendChild(m);
    boardEl.classList.remove('hidden');
    const r = await getScores(50);
    fillScoreRows(list, r.data, true); markLocal(list, r.local);
  }

  function showMenu(){
    menuActive = true; menuT0 = undefined;
    menuEl.classList.remove('hidden'); boardEl.classList.add('hidden');
    overlay.classList.add('hidden');
    document.getElementById('hud').style.visibility = 'hidden';
    if(copGroup) copGroup.visible = false;
    clearSegLabel();
    const topP = loadMenuTop3();
    requestAnimationFrame(menuLoop);
    return topP;
  }
  function hideMenu(){
    if(!menuActive) return;
    menuActive = false;
    swoopLookOverride = menuLook.clone();       // přechod kamery navazuje na pohled z menu
    menuEl.classList.add('hidden'); boardEl.classList.add('hidden');
    document.getElementById('hud').style.visibility = '';
  }
  document.getElementById('mPlay').addEventListener('click', requestStart);
  document.getElementById('mBoard').addEventListener('click', openBoard);
  document.getElementById('mBack').addEventListener('click', ()=>{ try{ (window.top || window).location.href = BACK_URL; }catch(e){ window.location.href = BACK_URL; } });
  document.getElementById('boardClose').addEventListener('click', ()=>boardEl.classList.add('hidden'));
  boardEl.addEventListener('click', e=>{ if(e.target === boardEl) boardEl.classList.add('hidden'); });

  initThree();
  obstacles = []; coins = []; bottles = [];
  currentLane = 2; targetX = 0; jumping=false; jumpT=0;
  loadExternalSegments(); // zkusí segments/segment_0001.js, 0002.js, ...
  renderer.render(scene, camera);
  // Menu se staví schované pod loading obrazovkou; ta zmizí, až je hotové (modely aut, žebříček, první snímky).
  const menuTopP = showMenu();   // menu se ukáže vždy (i když je hra vložená v iframe); test z editoru ho při příchodu segmentu schová (startTest -> hideMenu)
  (async function finishLoading(){
    const loadingEl = document.getElementById('loading'), loadBar = document.getElementById('loadBar'), loadMsg = document.getElementById('loadMsg');
    // Pokud hru otevřela úvodní stránka (pee-runner-start.html), ukazatel navazuje tam, kde skončila ona.
    let startP = 0;
    try{ startP = Math.max(0, Math.min(0.9, parseFloat(sessionStorage.getItem('prLoadP')) || 0)); sessionStorage.removeItem('prLoadP'); }catch(e){}
    const setP = p => { const v = startP + (1 - startP)*p; loadBar.style.width = Math.round(Math.max(4, Math.min(100, v*100))) + '%'; };
    const ids = Object.keys(CAR_MODELS);
    for(let i=0;i<ids.length;i++){
      await new Promise(r=>setTimeout(r,0));                 // po jednom modelu, ať se stihne překreslit ukazatel
      try{ getCarInfo(ids[i]); }catch(e){}
      setP(0.85*(i+1)/ids.length);
    }
    loadMsg.textContent = 'Načítám žebříček…';
    await Promise.race([ Promise.all([scoresProbe, menuTopP]), new Promise(r=>setTimeout(r,6000)) ]);
    setP(1);
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));   // pár snímků menu už je nakreslených
    loadingEl.classList.add('done');
    setTimeout(()=>loadingEl.classList.add('hidden'), 450);
  })();
  // Dá editoru vědět, že hra je připravená přijmout segment k testu.
  try{ if(window.parent && window.parent !== window) window.parent.postMessage({type:'pr-ready'}, '*'); }catch(e){}
})();
</script>
