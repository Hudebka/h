<!DOCTYPE html>
<html lang="cs">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zpěvník – Hudebka</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: #eee;
}

.horni-lista {
    position: sticky;
    top: 0;
    z-index: 10;
    padding: 15px 20px;
    background: rgba(15,15,15,.95);
    border-bottom: 1px solid #333;
}

.horni-lista a {
    color: #ccc;
    text-decoration: none;
}

.horni-lista a:hover {
    color: white;
}

main {
    max-width: 900px;
    margin: auto;
    padding: 50px 20px 80px;
}

h1 {
    font-size: 38px;
    margin: 0 0 25px;
}

#hledat {
    width: 100%;
    padding: 14px 20px;
    font-size: 17px;
    color: #eee;
    background: #1c1c1c;
    border: 1px solid #333;
    border-radius: 30px;
    outline: none;
    margin-bottom: 10px;
}

#hledat:focus {
    border-color: #e63946;
}

#pocet {
    color: #777;
    font-size: 14px;
    margin: 0 0 20px 20px;
}

.pisnicky-seznam {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.pisnicka-radek {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 10px 18px;
    background: #1c1c1c;
    border: 1px solid #333;
    border-radius: 12px;
    transition: .2s;
}

.pisnicka-radek:hover {
    border-color: #e63946;
}

.nazev {
    font-weight: bold;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.autor {
    color: #999;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.button {
    display: inline-block;
    padding: 7px 18px;
    font-family: inherit;
    font-size: 14px;
    border: none;
    border-radius: 30px;
    background: #e63946;
    color: white;
    text-decoration: none;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

.button:hover {
    transform: scale(1.05);
    background: #ff4d5a;
}

/* karta kolem textu písničky (používá ji pisnicky.js) */
.card {
    background: #1c1c1c;
    border: 1px solid #333;
    border-radius: 16px;
    padding: 25px;
}

.prazdno {
    color: #888;
    padding: 20px;
    text-align: center;
}

</style>

</head>


<body>

<div class="horni-lista">
    <a href="index.html">← Zpět na Hudebku</a>
</div>

<main>

    <h1>📖 Zpěvník</h1>

    <input type="search" id="hledat" placeholder="Hledat podle názvu, autora nebo textu…" autocomplete="off" disabled>
    <p id="pocet"></p>

    <div id="vsechnyPisnicky" class="pisnicky-seznam">
        <div class="prazdno">Načítám...</div>
    </div>

    <!-- celoobrazovková písnička (obsluhuje pisnicky.js) -->
    <div id="zpevnik" style="display:none;">
        <div id="zpevnikObsah"></div>
    </div>

</main>


<script src="pisnicky.js"></script>

<script>

// Načítání písniček i jejich zobrazení řeší pisnicky.js,
// tahle stránka přidává seznam všech písniček a vyhledávání.

// hledání bez ohledu na diakritiku a velikost písmen
const normalizuj = t => (t || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase();

const seznam = document.getElementById("vsechnyPisnicky");
const pocet = document.getElementById("pocet");
const hledat = document.getElementById("hledat");

let pisnicky = [];
let neNactene = [];

function vytvorProuzek(pisnicka) {

    const radek = document.createElement("div");
    radek.className = "pisnicka-radek";

    const nazev = document.createElement("span");
    nazev.className = "nazev";
    nazev.textContent = pisnicka.nazev;

    const autor = document.createElement("span");
    autor.className = "autor";
    autor.textContent = pisnicka.autor;

    const tlacitko = document.createElement("button");
    tlacitko.className = "button";
    tlacitko.textContent = "Zobrazit";
    tlacitko.addEventListener("click", () => zobrazZpevnik(pisnicka));

    radek.append(nazev, autor, tlacitko);

    return radek;
}

function vykresli() {

    const slova = normalizuj(hledat.value.trim())
        .split(/\s+/)
        .filter(Boolean);

    seznam.innerHTML = "";

    const nalezene = pisnicky.filter(p =>
        slova.every(s => p.hledani.includes(s))
    );

    nalezene.forEach(p => seznam.appendChild(vytvorProuzek(p)));

    if (!pisnicky.length) {
        seznam.innerHTML = '<div class="prazdno">Zatím tu nejsou žádné písničky.</div>';
    }
    else if (!nalezene.length) {
        seznam.innerHTML = '<div class="prazdno">Nic jsme nenašli.</div>';
    }

    pocet.textContent = slova.length
        ? `Nalezeno: ${nalezene.length} z ${pisnicky.length}`
        : `Písniček: ${pisnicky.length}`;

    if (neNactene.length) {
        pocet.textContent += ` (nepodařilo se načíst: ${neNactene.join(", ")})`;
    }
}

async function nactiVsechny() {

    const vysledky = await Promise.allSettled(
        PISNICKY.map(soubor => nactiPisnicku(soubor))
    );

    vysledky.forEach((v, i) => {

        if (v.status !== "fulfilled") {
            console.error("CHYBA PÍSNIČKY:", v.reason);
            neNactene.push(PISNICKY[i]);
            return;
        }

        const p = v.value;

        // pro hledání použijeme jen názvy a text, ne řádky s akordy
        const text = p.radky
            .filter(r =>
                !r.startsWith("NÁZEV:") &&
                !r.startsWith("AUTOR:") &&
                !jeAkordovyRadek(r)
            )
            .join(" ");

        p.hledani = normalizuj(p.nazev + " " + p.autor + " " + text);

        pisnicky.push(p);
    });

    pisnicky.sort((a, b) => a.nazev.localeCompare(b.nazev, "cs"));

    hledat.disabled = false;
    hledat.addEventListener("input", vykresli);

    vykresli();
}

nactiVsechny();

</script>

</body>
</html>
