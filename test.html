<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Supabase test</title>
</head>
<body>

<h1>Test skóre</h1>

<input id="jmeno" placeholder="Tvoje jméno">
<input id="skore" type="number" placeholder="Skóre">
<button onclick="ulozSkore()">Uložit skóre</button>

<p id="vysledek"></p>

<h2>🏆 Žebříček</h2>
<div id="zebricek">Načítám...</div>
    
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://roxjuzctepcgqwtvbfxi.supabase.co";

const SUPABASE_KEY = "sb_publishable_2tx7xGmhpxD-X9UZ2l39aA_eCaPeWx5";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function ulozSkore() {

    const jmeno = document.getElementById("jmeno").value;
    const skore = Number(document.getElementById("skore").value);

    const { data, error } = await db
        .from("scores")
        .insert([
            {
                player_name: jmeno,
                score: skore,
                game: "test"
            }
        ]);

    if (error) {
        console.error(error);
        document.getElementById("vysledek").textContent =
            "CHYBA: " + error.message;
        return;
    }

    document.getElementById("vysledek").textContent =
        "Skóre uloženo!";
    nactiZebricek();
}

async function nactiZebricek() {

    const { data, error } = await db
        .from("scores")
        .select("player_name, score, created_at")
        .order("score", { ascending: false })
        .limit(10);

    if (error) {
        console.error(error);
        document.getElementById("zebricek").textContent =
            "CHYBA: " + error.message;
        return;
    }

    const seznam = document.getElementById("zebricek");

    seznam.innerHTML = "";

    data.forEach((hrac, index) => {

        const radek = document.createElement("div");

        radek.textContent =
            `${index + 1}. ${hrac.player_name} — ${hrac.score}`;

        seznam.appendChild(radek);
    });
}

nactiZebricek();
</script>

</body>
</html>
